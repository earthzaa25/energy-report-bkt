<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Official Memo Print Styles */
        @media print {
            @page { size: landscape; margin: 15mm; }
            :root { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            /* แก้ไขปัญหาเนื้อหาถูกตัดเวลาพิมพ์ */
            html, body, #root, .h-screen { height: auto !important; min-height: 100% !important; overflow: visible !important; }
            .overflow-hidden, .overflow-auto, .overflow-x-auto, .overflow-y-auto { overflow: visible !important; }
            
            .memo-page { 
                width: 210mm; 
                min-height: 297mm; 
                padding: 20mm; 
                margin: 0 auto; 
                background: white; 
                font-size: 16pt;
                line-height: 1.5;
            }
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-container { width: 100%; max-width: 100%; margin: 0; padding: 0; box-shadow: none; overflow: visible !important; display: block !important; }
            
            /* Ensure tables break cleanly */
            table { page-break-inside: auto; width: 100% !important; }
            tr    { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
        .print-only { display: none; }
        
        .memo-preview {
            background: white;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 800px;
            margin: 0 auto;
            color: black;
            font-size: 16px;
        }

        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        const Building2Icon = Building2;

        // --- DEFAULT DATA & CONSTANTS ---

                'สน.ทท.เขาทุ่งสง', 'สน.ทท.ค่ายวิภาวดีรังสิต', 'สน.ทท.คีรีรัฐนิคม',

        const MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const YEARS = ['2567', '2568', '2569'];

        const getOilTotal = (oil) => {
            if (!oil) return 0;
            return (Number(oil.operational?.diesel) || 0) + (Number(oil.operational?.benzene) || 0) + (Number(oil.operational?.aviation) || 0) + (Number(oil.administrative?.diesel) || 0) + (Number(oil.administrative?.benzene) || 0);
        };

        const aggregateTotals = (filteredData) => {
            return filteredData.reduce((acc, d) => {
                acc.elec_std += Number(d.electricity?.standard) || 0;
                acc.elec_act += Number(d.electricity?.actual) || 0;
                acc.elec_cost += Number(d.electricity?.cost) || 0;
                acc.water_std += Number(d.water?.standard) || 0;
                acc.water_act += Number(d.water?.actual) || 0;
                acc.water_cost += Number(d.water?.cost) || 0;
                acc.oil_op_diesel += Number(d.oil?.operational?.diesel) || 0;
                acc.oil_op_benzene += Number(d.oil?.operational?.benzene) || 0;
                acc.oil_op_aviation += Number(d.oil?.operational?.aviation) || 0;
                acc.oil_adm_diesel += Number(d.oil?.administrative?.diesel) || 0;
                acc.oil_adm_benzene += Number(d.oil?.administrative?.benzene) || 0;
                acc.oil_total += getOilTotal(d.oil);
                return acc;
            }, {
                elec_std: 0, elec_act: 0, elec_cost: 0, water_std: 0, water_act: 0, water_cost: 0,
                oil_op_diesel: 0, oil_op_benzene: 0, oil_op_aviation: 0, oil_adm_diesel: 0, oil_adm_benzene: 0, oil_total: 0
            });
        };

        // --- HELPER COMPONENTS ---
        // ฟังก์ชันสร้าง Modal แทนการใช้ alert/confirm 
        function Modal({ isOpen, onClose, onConfirm, title, message, type = 'alert' }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 animate-in fade-in zoom-in duration-200">
                        <div className="flex items-center mb-4">
                            {type === 'alert' && <AlertCircle className="w-6 h-6 text-blue-500 mr-2" />}
                            {type === 'confirm' && <AlertTriangle className="w-6 h-6 text-orange-500 mr-2" />}
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                        </div>
                        <p className="text-slate-600 mb-6 whitespace-pre-line">{message}</p>
                        <div className="flex justify-end space-x-3">
                            {type === 'confirm' && (
                                <button onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 font-medium">ยกเลิก</button>
                            )}
                            <button onClick={onConfirm || onClose} className={`px-4 py-2 text-white rounded-lg font-medium ${type === 'confirm' ? 'bg-orange-600 hover:bg-orange-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {type === 'confirm' ? 'ยืนยัน' : 'ตกลง'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, unit, highlight, trend, subtitle, format, alert }) {
            let valueColor = "text-slate-800";
            let bgClass = "bg-white border-slate-200";

            if (highlight) valueColor = "text-blue-700";
            if (trend === 'up') {
                valueColor = "text-rose-700";
                bgClass = "bg-rose-50 border-rose-200";
            }
            if (trend === 'down') {
                valueColor = "text-emerald-700";
                bgClass = "bg-emerald-50 border-emerald-200";
            }

            const displayValue = format === 'currency' 
                ? value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                : value.toLocaleString(undefined, { maximumFractionDigits: 0 });

            return (
                <div className={`p-4 rounded-lg border shadow-sm flex flex-col justify-between ${bgClass} relative`}>
                    <h4 className="text-sm text-slate-500 mb-1 font-medium">{title}</h4>
                    <div className="flex items-baseline space-x-1">
                        <span className={`text-2xl font-bold ${valueColor}`}>{displayValue}</span>
                        {unit && <span className="text-sm text-slate-500">{unit}</span>}
                    </div>
                    {subtitle && (
                        <p className={`text-xs mt-1 font-medium ${trend === 'up' ? 'text-rose-600' : 'text-emerald-600'}`}>{subtitle}</p>
                    )}
                    {alert && (
                        <div className="absolute top-3 right-3 text-rose-500 bg-rose-100 p-1 rounded-full" title="เกินค่ากลาง">
                            <AlertTriangle className="w-4 h-4"/>
                        </div>
                    )}
                </div>
            );
        }

        // --- VIEW COMPONENTS ---
        function LoginScreen({ onLogin, hierarchy, unitPasswords }) {
            const [role, setRole] = useState('admin');
            const [unit, setUnit] = useState(hierarchy.leaves[0] || '');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                if (hierarchy.leaves.length > 0 && !hierarchy.leaves.includes(unit)) {
                    setUnit(hierarchy.leaves[0]);
                }
            }, [hierarchy.leaves, unit]);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                if (role === 'admin' && password !== 'admin123') return setError('รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง (ใช้: admin123)');
                if (role === 'executive' && password !== 'boss123') return setError('รหัสผ่านผู้บริหารไม่ถูกต้อง (ใช้: boss123)');
                if (role === 'user') {
                    const expectedPwd = unitPasswords[unit] || '1234';
                    if (password !== expectedPwd) return setError(`รหัสผ่านหน่วยงานไม่ถูกต้อง (ค่าเริ่มต้นคือ 1234)`);
                }
                
                onLogin(role, unit);
            };

            return (
                <div className="flex h-screen items-center justify-center bg-slate-900 relative overflow-hidden">
                    <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")' }}></div>
                    
                    <div className="bg-white p-10 rounded-2xl shadow-2xl w-[420px] max-w-[90%] relative z-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <ShieldCheck className="w-8 h-8 text-white" />
                            </div>
                            <h1 className="text-2xl font-bold font-serif text-slate-800 mb-1">ระบบรายงานพลังงาน</h1>
                            <p className="text-sm text-slate-500 font-medium">กองบัญชาการกองทัพไทย (บก.ทท.)</p>
                            <span className="inline-block mt-3 px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full uppercase tracking-wider">Enterprise Edition</span>
                        </div>

                        {error && <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-sm rounded-lg flex items-center"><AlertCircle className="w-4 h-4 mr-2 flex-shrink-0"/> {error}</div>}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">เข้าใช้งานในฐานะ</label>
                                <div className="relative">
                                    <select 
                                        value={role} 
                                        onChange={(e) => setRole(e.target.value)}
                                        className="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-slate-50"
                                    >
                                        <option value="admin">ผู้ดูแลระบบส่วนกลาง (Admin)</option>
                                        <option value="executive">ผู้บริหารระดับสูง (Executive)</option>
                                        <option value="user">ส่วนราชการ / หน่วยงานย่อย (User)</option>
                                    </select>
                                    <Briefcase className="w-5 h-5 text-slate-400 absolute left-3 top-3 pointer-events-none" />
                                </div>
                            </div>

                            {role === 'user' && (
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">เลือกหน่วยงานของคุณ</label>
                                    <div className="relative">
                                        <select 
                                            value={unit} 
                                            onChange={(e) => setUnit(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-slate-50"
                                        >
                                            {hierarchy.parents.map(parent => (
                                                <optgroup key={parent} label={hierarchy.dict[parent].length > 1 ? `กลุ่ม ${parent}` : parent}>
                                                    {hierarchy.dict[parent].map(u => <option key={u} value={u}>{u}</option>)}
                                                </optgroup>
                                            ))}
                                        </select>
                                        <Building2Icon className="w-5 h-5 text-slate-400 absolute left-3 top-3 pointer-events-none" />
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">รหัสผ่าน (Password)</label>
                                <div className="relative">
                                    <input 
                                        type="password" 
                                        placeholder="กรอกรหัสผ่าน"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                    <Lock className="w-5 h-5 text-slate-400 absolute left-3 top-3 pointer-events-none" />
                                </div>
                            </div>

                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors mt-2 shadow-md">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                            *Demo Passwords: Admin=<code>admin123</code> | Exec=<code>boss123</code> | User=<code>1234</code> (เว้นแต่จะถูกเปลี่ยน)
                        </div>
                    </div>
                </div>
            );
        }

        function UnitSettings({ hierarchy, onUpdateHierarchy, unitPasswords, onUpdatePasswords, onAddLog, showModal }) {
            const [newParentName, setNewParentName] = useState('');
            const [newChildNames, setNewChildNames] = useState({});
            const [localPwds, setLocalPwds] = useState(unitPasswords);

            useEffect(() => {
                setLocalPwds(unitPasswords);
            }, [unitPasswords]);

            const handleAddParent = () => {
                if (newParentName.trim() === '') return;
                if (hierarchy.parents.includes(newParentName)) return showModal({title: 'เกิดข้อผิดพลาด', message: 'ชื่อกลุ่มหน่วยงานนี้มีอยู่แล้วในระบบ', type: 'alert'});
                
                const updatedDict = { ...hierarchy.dict, [newParentName]: [newParentName] };
                onUpdateHierarchy(updatedDict);
                onAddLog('เพิ่มกลุ่มหน่วยงาน', `เพิ่มกลุ่มหน่วยแม่: ${newParentName}`);
                setNewParentName('');
            };

            const handleAddChild = (parent) => {
                const childName = newChildNames[parent];
                if (!childName || childName.trim() === '') return;
                if (hierarchy.leaves.includes(childName)) return showModal({title: 'เกิดข้อผิดพลาด', message: 'ชื่อหน่วยงานย่อยนี้มีอยู่แล้วในระบบ ไม่สามารถซ้ำได้', type: 'alert'});
                
                const updatedChildren = [...hierarchy.dict[parent], childName];
                const updatedDict = { ...hierarchy.dict, [parent]: updatedChildren };
                onUpdateHierarchy(updatedDict);
                onAddLog('เพิ่มหน่วยงานย่อย', `เพิ่ม ${childName} ภายใต้กลุ่ม ${parent}`);
                setNewChildNames(prev => ({ ...prev, [parent]: '' }));
            };

            const handleDeleteChild = (parent, child) => {
                showModal({
                    title: 'ยืนยันการลบ', 
                    message: `คุณแน่ใจหรือไม่ว่าต้องการลบหน่วยงาน "${child}" ออกจากระบบ?\n(ข้อมูลเก่าจะยังอยู่ในฐานข้อมูล แต่อาจไม่แสดงผลในรายงานรวม)`, 
                    type: 'confirm',
                    onConfirm: () => {
                        const updatedChildren = hierarchy.dict[parent].filter(c => c !== child);
                        onUpdateHierarchy({ ...hierarchy.dict, [parent]: updatedChildren });
                        onAddLog('ลบหน่วยงานย่อย', `ลบ ${child} ออกจากกลุ่ม ${parent}`);
                    }
                });
            };

            const handleDeleteParent = (parent) => {
                showModal({
                    title: 'คำเตือน: ยืนยันการลบกลุ่ม', 
                    message: `คุณต้องการลบกลุ่ม "${parent}" พร้อมทั้งหน่วยงานย่อยทั้งหมดในกลุ่มนี้ใช่หรือไม่?`, 
                    type: 'confirm',
                    onConfirm: () => {
                        const newDict = { ...hierarchy.dict };
                        delete newDict[parent];
                        onUpdateHierarchy(newDict);
                        onAddLog('ลบกลุ่มหน่วยงาน', `ลบกลุ่ม ${parent} ทั้งหมด`);
                    }
                });
            };

            const handlePwdChange = (u, val) => {
                setLocalPwds(prev => ({ ...prev, [u]: val }));
            };

            const handleSavePasswords = () => {
                onUpdatePasswords(localPwds);
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-lg text-slate-800 mb-2">1. โครงสร้างหน่วยงานในระบบ</h3>
                        <p className="text-sm text-slate-500 mb-6">เพิ่มหรือลดรายชื่อหน่วยงาน เพื่อให้หน่วยงานเหล่านั้นสามารถล็อกอินเข้าระบบและบันทึกข้อมูลได้</p>
                        
                        <div className="flex space-x-3 mb-8 bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <input 
                                type="text" placeholder="พิมพ์ชื่อกลุ่มหน่วยงานหลัก (เช่น สส.ทหาร)" 
                                className="border border-slate-300 rounded p-2 flex-1 focus:ring-2 focus:ring-blue-500"
                                value={newParentName} onChange={e => setNewParentName(e.target.value)}
                            />
                            <button onClick={handleAddParent} className="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">+ เพิ่มกลุ่มหน่วยแม่</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {hierarchy.parents.map(parent => (
                                <div key={parent} className="border border-slate-200 rounded-lg shadow-sm bg-white overflow-hidden flex flex-col">
                                    <div className="bg-slate-800 p-3 flex justify-between items-center text-white">
                                        <h4 className="font-bold text-sm truncate flex-1">{parent}</h4>
                                        <button onClick={() => handleDeleteParent(parent)} title="ลบกลุ่มนี้" className="text-slate-400 hover:text-rose-400 ml-2"><Trash2 className="w-4 h-4" /></button>
                                    </div>
                                    <div className="p-3 flex-1 overflow-y-auto max-h-60 bg-slate-50">
                                        <ul className="space-y-1">
                                            {hierarchy.dict[parent].map((child, idx) => (
                                                <li key={child} className="flex justify-between items-center bg-white p-2 rounded border border-slate-100 text-sm">
                                                    <span className={`truncate ${idx===0 ? 'font-bold text-blue-700' : 'text-slate-700'}`}>{idx===0 ? `▪ ${child}` : `- ${child}`}</span>
                                                    <button onClick={() => handleDeleteChild(parent, child)} className="text-slate-300 hover:text-rose-500"><XCircle className="w-4 h-4" /></button>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="p-3 bg-white border-t border-slate-200">
                                        <div className="flex space-x-2">
                                            <input 
                                                type="text" placeholder="เพิ่มหน่วยย่อย..." 
                                                className="border border-slate-300 rounded px-2 py-1 flex-1 text-sm focus:ring-1 focus:ring-blue-500"
                                                value={newChildNames[parent] || ''} onChange={e => setNewChildNames(prev => ({...prev, [parent]: e.target.value}))}
                                                onKeyDown={e => e.key === 'Enter' && handleAddChild(parent)}
                                            />
                                            <button onClick={() => handleAddChild(parent)} className="bg-emerald-600 text-white px-2 py-1 rounded text-sm hover:bg-emerald-700">เพิ่ม</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
                            <h3 className="font-bold text-lg flex items-center"><Lock className="w-5 h-5 mr-2"/> 2. จัดการรหัสผ่านแยกแต่ละหน่วยงาน</h3>
                            <button onClick={handleSavePasswords} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-md flex items-center text-sm font-medium transition-colors">
                                <Save className="w-4 h-4 mr-2"/> บันทึกรหัสผ่าน
                            </button>
                        </div>
                        <div className="p-6">
                            <p className="text-sm text-slate-500 mb-4">กำหนดรหัสผ่านสำหรับการเข้าสู่ระบบของแต่ละหน่วยงาน (ค่าเริ่มต้นคือ 1234) หากมีการเปลี่ยนรหัสผ่าน หน่วยงานนั้นๆ จะต้องใช้รหัสผ่านใหม่ในการล็อกอินทันที</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {hierarchy.leaves.map(u => (
                                    <div key={`pwd-${u}`} className="flex justify-between items-center bg-slate-50 p-3 rounded border border-slate-200">
                                        <span className="text-sm font-medium text-slate-700 truncate mr-2" title={u}>{u}</span>
                                        <input 
                                            type="text" 
                                            value={localPwds[u] || '1234'} 
                                            onChange={(e) => handlePwdChange(u, e.target.value)}
                                            className="border border-slate-300 rounded p-1 text-sm w-24 text-center focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StandardSettings({ data, year, onUpdateStandards, hierarchy, onAddLog, showModal }) {
            const [localStds, setLocalStds] = useState({});

            useEffect(() => {
                const stds = {};
                hierarchy.leaves.forEach(u => {
                    const existing = data.find(d => d.year === year && d.unit === u && d.status === 'submitted');
                    stds[u] = {
                        elec: existing?.electricity?.standard || 50000,
                        water: existing?.water?.standard || 10000
                    };
                });
                setLocalStds(stds);
            }, [year, data, hierarchy.leaves]);

            const handleChange = (unit, field, value) => {
                setLocalStds(prev => ({ ...prev, [unit]: { ...prev[unit], [field]: value } }));
            };

            const handleSave = async () => {
                await onUpdateStandards(year, localStds);
                onAddLog('ตั้งค่าส่วนกลาง', `อัปเดตค่ากลาง (Standard) ประจำปีงบฯ ${year}`);
            };

            return (
                <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
                        <h3 className="font-bold text-lg flex items-center"><Settings className="w-5 h-5 mr-2"/> กำหนดค่ากลาง (Standard) ประจำปีงบฯ {year}</h3>
                        <button onClick={handleSave} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-md flex items-center text-sm font-medium transition-colors">
                            <Save className="w-4 h-4 mr-2"/> บันทึกการตั้งค่า
                        </button>
                    </div>
                    <div className="p-6">
                        <p className="text-sm text-slate-500 mb-4">คุณสามารถปรับปรุงค่ากลางของการใช้ไฟฟ้าและน้ำประปาของแต่ละหน่วยงานในหน้าต่างนี้ เมื่อบันทึกข้อมูลแล้ว ระบบจะอัปเดตการวิเคราะห์ผลต่าง (%) ในหน้า Dashboard อัตโนมัติ</p>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700">
                                        <th className="p-3 border-b border-slate-300 w-1/3">หน่วยงานย่อย</th>
                                        <th className="p-3 border-b border-slate-300 text-center w-1/3">ค่ากลาง ไฟฟ้า (หน่วย/เดือน)</th>
                                        <th className="p-3 border-b border-slate-300 text-center w-1/3">ค่ากลาง น้ำประปา (ลบ.ม./เดือน)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {hierarchy.parents.map(parent => (
                                        <React.Fragment key={`std-${parent}`}>
                                            <tr className="bg-slate-50">
                                                <td colSpan={3} className="p-2 font-bold text-slate-700 border-y border-slate-200">{parent}</td>
                                            </tr>
                                            {hierarchy.dict[parent].map(child => (
                                                <tr key={`std-${child}`} className="hover:bg-slate-50">
                                                    <td className="p-3 pl-8 text-slate-600">- {child}</td>
                                                    <td className="p-2 text-center">
                                                        <input type="number" value={localStds[child]?.elec || ''} onChange={(e) => handleChange(child, 'elec', e.target.value)} className="border border-slate-300 rounded p-1.5 w-32 text-right focus:ring-2 focus:ring-blue-500" />
                                                    </td>
                                                    <td className="p-2 text-center">
                                                        <input type="number" value={localStds[child]?.water || ''} onChange={(e) => handleChange(child, 'water', e.target.value)} className="border border-slate-300 rounded p-1.5 w-32 text-right focus:ring-2 focus:ring-blue-500" />
                                                    </td>
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function AuditLogs({ logs }) {
            return (
                <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
                        <h3 className="font-bold text-lg flex items-center"><HistoryIcon className="w-5 h-5 mr-2"/> ประวัติการใช้งานระบบ (Audit Logs)</h3>
                    </div>
                    <div className="p-0">
                        {logs.length === 0 ? (
                            <div className="p-8 text-center text-slate-500">ยังไม่มีประวัติการใช้งาน</div>
                        ) : (
                            <table className="w-full text-sm text-left">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                                        <th className="p-4 font-medium w-1/4">วัน-เวลา</th>
                                        <th className="p-4 font-medium w-1/4">ผู้ใช้งาน (หน่วย)</th>
                                        <th className="p-4 font-medium w-1/4">ประเภท</th>
                                        <th className="p-4 font-medium w-1/4">รายละเอียด</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {logs.map((log, i) => (
                                        <tr key={log.id || i} className="hover:bg-slate-50">
                                            <td className="p-4 text-slate-500">{log.timestamp}</td>
                                            <td className="p-4 font-medium text-slate-700">
                                                {log.user} <span className="text-xs font-normal text-slate-400">({log.role})</span>
                                            </td>
                                            <td className="p-4"><span className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-medium">{log.action}</span></td>
                                            <td className="p-4 text-slate-600">{log.details}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
            );
        }

        function Dashboard({ unit, month, year, data, activeCategory, hierarchy, currentUser }) {
            const [viewMode, setViewMode] = useState('chart'); 
            const [comparisonMode, setComparisonMode] = useState('mom'); 
            
            const isGroup = unit.startsWith('GROUP_');
            const actualUnit = isGroup ? unit.replace('GROUP_', '') : unit;
            const isYearly = month === 'สรุปรายปี';

            const displayUnits = useMemo(() => {
                if (unit === 'overall') return hierarchy.leaves;
                if (isGroup) return hierarchy.dict[actualUnit];
                return [unit];
            }, [unit, isGroup, actualUnit, hierarchy]);

            const currentData = useMemo(() => {
                return data.filter(d => d.year === year && (isYearly ? true : d.month === month) && displayUnits.includes(d.unit) && d.status === 'submitted');
            }, [data, month, year, displayUnits, isYearly]);

            const stats = useMemo(() => aggregateTotals(currentData), [currentData]);

            const prevStats = useMemo(() => {
                const monthIndex = MONTHS.indexOf(month);
                let pMonth, pYear;
                
                if (isYearly) {
                    pMonth = null;
                    pYear = (parseInt(year) - 1).toString();
                } else {
                    if (comparisonMode === 'mom') {
                        pMonth = monthIndex === 0 ? MONTHS[11] : MONTHS[monthIndex - 1];
                        pYear = monthIndex === 0 ? (parseInt(year) - 1).toString() : year;
                    } else {
                        pMonth = month;
                        pYear = (parseInt(year) - 1).toString();
                    }
                }
                
                const pData = data.filter(d => d.year === pYear && (isYearly ? true : d.month === pMonth) && displayUnits.includes(d.unit) && d.status === 'submitted');
                return aggregateTotals(pData);
            }, [data, month, year, displayUnits, isYearly, comparisonMode]);

            const ytdStats = useMemo(() => {
                if (isYearly) return stats; 
                const monthIndex = MONTHS.indexOf(month);
                const validMonths = MONTHS.slice(0, monthIndex + 1);
                const yData = data.filter(d => d.year === year && validMonths.includes(d.month) && displayUnits.includes(d.unit) && d.status === 'submitted');
                return aggregateTotals(yData);
            }, [data, month, year, displayUnits, isYearly, stats]);

            // --- KPI & Forecasting Logic ---
            const kpiStats = useMemo(() => {
                const targetElec = ytdStats.elec_std * 0.8;
                const targetWater = ytdStats.water_std * 0.8;
                
                const elecPass = ytdStats.elec_act <= targetElec;
                const waterPass = ytdStats.water_act <= targetWater;
                
                const elecPercent = ytdStats.elec_std > 0 ? (ytdStats.elec_act / ytdStats.elec_std) * 100 : 0;
                const waterPercent = ytdStats.water_std > 0 ? (ytdStats.water_act / ytdStats.water_std) * 100 : 0;

                const elecBudget = ytdStats.elec_std > 0 ? (ytdStats.elec_cost / ytdStats.elec_act) * ytdStats.elec_std * 12 : 5000000;
                const elecSpentPercent = elecBudget > 0 ? (ytdStats.elec_cost / elecBudget) * 100 : 0;

                return { targetElec, targetWater, elecPass, waterPass, elecPercent, waterPercent, elecBudget, elecCost: ytdStats.elec_cost, elecSpentPercent };
            }, [ytdStats]);

            const trendChartData = useMemo(() => {
                if (activeCategory !== 'all' || isYearly) return [];
                const leavesToSum = unit === 'overall' ? hierarchy.leaves : (isGroup ? hierarchy.dict[actualUnit] : [unit]);
                const averages = { elec: 0, water: 0 };
                let totalSubmittedMonths = 0;
                
                const monthlyData = MONTHS.map(m => {
                    const dList = data.filter(item => item.year === year && item.month === m && leavesToSum.includes(item.unit) && item.status === 'submitted');
                    let elec_actual = 0, elec_std = 0;
                    let isSubmitted = false;

                    if (dList.length > 0) {
                        isSubmitted = true;
                        totalSubmittedMonths++;
                        const totals = aggregateTotals(dList);
                        elec_actual = totals.elec_act;
                        elec_std = totals.elec_std;
                        averages.elec += elec_actual;
                    } else {
                         const prevList = data.filter(item => item.year === year && item.month === MONTHS[0] && leavesToSum.includes(item.unit));
                         if (prevList.length > 0) elec_std = aggregateTotals(prevList).elec_std;
                    }

                    return { name: m, isSubmitted, elec_actual: isSubmitted ? elec_actual : null, elec_std };
                });

                if (totalSubmittedMonths > 0) averages.elec /= totalSubmittedMonths;

                return monthlyData.map(d => ({
                    ...d,
                    elec_forecast: !d.isSubmitted ? averages.elec : null,
                    elec_kpi: d.elec_std * 0.8
                }));
            }, [data, unit, year, isGroup, actualUnit, hierarchy, activeCategory, isYearly]);

            const leaderboard = useMemo(() => {
                if (unit !== 'overall') return []; 
                const unitStats = hierarchy.leaves.map(u => {
                    const uData = data.filter(d => d.year === year && (isYearly ? true : d.month === month) && d.unit === u && d.status === 'submitted');
                    const totals = aggregateTotals(uData);
                    const savingPercent = totals.elec_std > 0 ? ((totals.elec_act - totals.elec_std) / totals.elec_std) * 100 : 0;
                    return { unit: u, percent: savingPercent, actual: totals.elec_act, std: totals.elec_std };
                }).filter(u => u.std > 0); 

                unitStats.sort((a, b) => a.percent - b.percent);
                return unitStats.slice(0, 5);
            }, [data, year, month, isYearly, hierarchy.leaves, unit]);

            const chartData = useMemo(() => {
                if (unit === 'overall' || isGroup) {
                    const iterationTarget = unit === 'overall' ? hierarchy.parents.map(p => hierarchy.dict[p][0]) : hierarchy.dict[actualUnit];
                    return iterationTarget.map(iter => {
                        const children = [iter]; 
                        const dList = data.filter(item => item.year === year && (isYearly ? true : item.month === month) && children.includes(item.unit) && item.status === 'submitted');
                        const totals = aggregateTotals(dList);
                        return {
                            name: iter, elec_actual: totals.elec_act, water_actual: totals.water_act, oil_actual: totals.oil_total,
                            elec_std: totals.elec_std, water_std: totals.water_std,
                            oil_op_diesel: totals.oil_op_diesel, oil_op_benzene: totals.oil_op_benzene, oil_op_aviation: totals.oil_op_aviation,
                            oil_adm_diesel: totals.oil_adm_diesel, oil_adm_benzene: totals.oil_adm_benzene,
                        };
                    });
                } else {
                    return MONTHS.map(m => {
                        const dList = data.filter(item => item.year === year && item.unit === unit && item.month === m && item.status === 'submitted');
                        const totals = aggregateTotals(dList);
                        return {
                            name: m, elec_actual: totals.elec_act, elec_std: totals.elec_std,
                            water_actual: totals.water_act, water_std: totals.water_std, oil_actual: totals.oil_total,
                            oil_op_diesel: totals.oil_op_diesel, oil_op_benzene: totals.oil_op_benzene, oil_op_aviation: totals.oil_op_aviation,
                            oil_adm_diesel: totals.oil_adm_diesel, oil_adm_benzene: totals.oil_adm_benzene,
                        };
                    });
                }
            }, [data, unit, month, year, isGroup, actualUnit, isYearly, hierarchy]);

            const allUnitsComparisonData = useMemo(() => {
                const monthIndex = MONTHS.indexOf(month);
                let pMonth, pYear;
                if (isYearly) { pMonth = null; pYear = (parseInt(year) - 1).toString(); }
                else {
                    if (comparisonMode === 'mom') { pMonth = monthIndex === 0 ? MONTHS[11] : MONTHS[monthIndex - 1]; pYear = monthIndex === 0 ? (parseInt(year) - 1).toString() : year; }
                    else { pMonth = month; pYear = (parseInt(year) - 1).toString(); }
                }

                const targetUnits = unit === 'overall' ? hierarchy.parents.map(p => hierarchy.dict[p][0]) : displayUnits;

                return targetUnits.map(u => {
                    const children = [u]; 
                    const currTotals = aggregateTotals(data.filter(d => d.year === year && (isYearly ? true : d.month === month) && children.includes(d.unit) && d.status === 'submitted'));
                    const prevTotals = aggregateTotals(data.filter(d => d.year === pYear && (isYearly ? true : d.month === pMonth) && children.includes(d.unit) && d.status === 'submitted'));
                    return {
                        unit: u, elec_curr: currTotals.elec_act, elec_prev: prevTotals.elec_act,
                        water_curr: currTotals.water_act, water_prev: prevTotals.water_act,
                        oil_curr: currTotals.oil_total, oil_prev: prevTotals.oil_total,
                    };
                });
            }, [data, month, year, displayUnits, unit, isYearly, comparisonMode, hierarchy]);

            const calcDiff = (curr, prev) => {
                if (prev === 0 && curr === 0) return { text: '-', color: 'text-slate-400' };
                if (prev === 0) return { text: '+100%', color: 'text-rose-600' };
                const diff = ((curr - prev) / prev) * 100;
                const isUp = diff > 0;
                return { 
                    text: `${isUp ? '+' : ''}${Math.abs(diff).toFixed(1)}%`, 
                    color: isUp ? 'text-rose-600 font-medium' : 'text-emerald-600 font-medium',
                    icon: isUp ? <TrendingUp className="inline w-3 h-3 mr-1" /> : <TrendingDown className="inline w-3 h-3 mr-1" />
                };
            };

            const elecDiff = stats.elec_act - stats.elec_std;
            const waterDiff = stats.water_act - stats.water_std;
            const comparisonSubtitle = isYearly ? "ปีปัจจุบัน vs ปีก่อน" : (comparisonMode === 'mom' ? "เดือนปัจจุบัน vs เดือนก่อน" : "เดือนปัจจุบัน vs เดือนเดียวกันปีก่อน");
            const comparisonPrevName = isYearly ? "ปีก่อน" : (comparisonMode === 'mom' ? "เดือนก่อน" : "ปีก่อน");

            const renderMoM = (current, previous, unitText) => {
                if (previous === 0) return <span className="text-slate-400 text-sm">ไม่มีข้อมูลอดีตเปรียบเทียบ</span>;
                const diff = current - previous;
                const percent = ((diff / previous) * 100).toFixed(1);
                const isUp = diff > 0;
                return (
                    <div className={`flex items-center text-sm font-medium ${isUp ? 'text-rose-600' : 'text-emerald-600'}`}>
                        {isUp ? <TrendingUp className="w-4 h-4 mr-1" /> : <TrendingDown className="w-4 h-4 mr-1" />}
                        <span>{Math.abs(diff).toLocaleString(undefined, {maximumFractionDigits:0})} {unitText} ({Math.abs(percent)}%)</span>
                    </div>
                );
            };

            if (currentData.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-full text-slate-500 bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <AlertCircle className="w-16 h-16 mb-4 text-slate-300" />
                        <h3 className="text-xl">หน่วยงานที่เลือกยังไม่ได้รายงานข้อมูลในช่วงเวลาที่ระบุ</h3>
                        <p className="mt-2">โปรดรอการรายงาน หรือปรับเปลี่ยนเดือน/ปี ที่ต้องการดู</p>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-6 no-print gap-4">
                        <div className="flex items-center space-x-4">
                            <span className="text-sm font-bold text-slate-700">รูปแบบการเปรียบเทียบอดีต:</span>
                            {!isYearly ? (
                                <div className="flex bg-slate-100 rounded-lg p-1">
                                    <button onClick={() => setComparisonMode('mom')} className={`px-3 py-1 text-sm rounded-md transition-colors ${comparisonMode === 'mom' ? 'bg-white shadow-sm font-bold text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>เดือนก่อน (MoM)</button>
                                    <button onClick={() => setComparisonMode('yoy')} className={`px-3 py-1 text-sm rounded-md transition-colors ${comparisonMode === 'yoy' ? 'bg-white shadow-sm font-bold text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>ปีก่อน (YoY)</button>
                                </div>
                            ) : (
                                <span className="text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1 rounded-md">ปีปัจจุบัน vs ปีก่อน (YoY)</span>
                            )}
                        </div>
                        <div className="flex items-center space-x-4">
                            <span className="text-sm font-bold text-slate-700">รูปแบบตาราง/กราฟ (ภาพรวม):</span>
                            <div className="flex bg-slate-100 rounded-lg p-1">
                                <button onClick={() => setViewMode('chart')} className={`px-3 py-1 text-sm rounded-md transition-colors flex items-center ${viewMode === 'chart' ? 'bg-white shadow-sm font-bold text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>📊 กราฟ</button>
                                <button onClick={() => setViewMode('table')} className={`px-3 py-1 text-sm rounded-md transition-colors flex items-center ${viewMode === 'table' ? 'bg-white shadow-sm font-bold text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>📝 ตาราง</button>
                            </div>
                        </div>
                    </div>

                    {(activeCategory === 'all' && (currentUser.role === 'admin' || currentUser.role === 'executive') && unit === 'overall') && (
                        <div className="bg-slate-900 rounded-xl shadow-lg border border-slate-800 overflow-hidden mb-8 no-print text-white">
                            <div className="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-950">
                                <h3 className="text-lg font-bold flex items-center text-yellow-400">
                                    <Briefcase className="w-5 h-5 mr-2" /> Executive Analytics Dashboard
                                </h3>
                                <span className="text-xs bg-blue-600 px-2 py-1 rounded text-white font-medium">ภาพรวมระดับองค์กร</span>
                            </div>
                            
                            <div className="p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="bg-slate-800/50 rounded-lg p-4 border border-slate-700/50">
                                    <h4 className="font-bold text-slate-300 mb-4 flex items-center">
                                        <Trophy className="w-5 h-5 mr-2 text-yellow-400" /> จัดอันดับประหยัดพลังงาน (Top 5)
                                    </h4>
                                    <ul className="space-y-3">
                                        {leaderboard.map((item, idx) => (
                                            <li key={item.unit} className="flex justify-between items-center text-sm border-b border-slate-700/50 pb-2">
                                                <div className="flex items-center">
                                                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs mr-3 font-bold ${idx === 0 ? 'bg-yellow-500 text-slate-900' : idx === 1 ? 'bg-slate-300 text-slate-900' : idx === 2 ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                                        {idx + 1}
                                                    </span>
                                                    <span className="font-medium text-slate-200">{item.unit}</span>
                                                </div>
                                                <span className={`font-bold ${item.percent < 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    {item.percent > 0 ? '+' : ''}{item.percent.toFixed(1)}%
                                                </span>
                                            </li>
                                        ))}
                                        {leaderboard.length === 0 && <li className="text-slate-500 text-sm">ไม่มีข้อมูลเพียงพอ</li>}
                                    </ul>
                                </div>

                                <div className="bg-slate-800/50 rounded-lg p-4 border border-slate-700/50">
                                    <h4 className="font-bold text-slate-300 mb-4 flex items-center">
                                        <Target className="w-5 h-5 mr-2 text-emerald-400" /> ตัวชี้วัดรัฐบาล 20% (YTD)
                                    </h4>
                                    <div className="space-y-5">
                                        <div>
                                            <div className="flex justify-between items-end mb-2">
                                                <span className="text-sm font-medium text-blue-300">ไฟฟ้า (เป้า: ≤ 80%)</span>
                                                <span className={`text-sm font-bold ${kpiStats.elecPass ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    ใช้ไปแล้ว {kpiStats.elecPercent.toFixed(1)}% 
                                                </span>
                                            </div>
                                            <div className="w-full bg-slate-700 rounded-full h-2.5 relative">
                                                <div className="absolute top-0 bottom-0 left-[80%] w-0.5 bg-emerald-400 z-10"></div>
                                                <div className="absolute top-0 bottom-0 left-[100%] w-0.5 bg-rose-500 z-10"></div>
                                                <div className={`h-2.5 rounded-full ${kpiStats.elecPass ? 'bg-blue-500' : 'bg-rose-500'}`} style={{ width: `${Math.min(kpiStats.elecPercent, 100)}%` }}></div>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-end mb-2">
                                                <span className="text-sm font-medium text-cyan-300">น้ำประปา (เป้า: ≤ 80%)</span>
                                                <span className={`text-sm font-bold ${kpiStats.waterPass ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    ใช้ไปแล้ว {kpiStats.waterPercent.toFixed(1)}% 
                                                </span>
                                            </div>
                                            <div className="w-full bg-slate-700 rounded-full h-2.5 relative">
                                                <div className="absolute top-0 bottom-0 left-[80%] w-0.5 bg-emerald-400 z-10"></div>
                                                <div className="absolute top-0 bottom-0 left-[100%] w-0.5 bg-rose-500 z-10"></div>
                                                <div className={`h-2.5 rounded-full ${kpiStats.waterPass ? 'bg-cyan-500' : 'bg-rose-500'}`} style={{ width: `${Math.min(kpiStats.waterPercent, 100)}%` }}></div>
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <h5 className="text-sm font-medium text-purple-300 mb-2">วิเคราะห์งบประมาณไฟฟ้า (ประมาณการ)</h5>
                                            <div className="flex justify-between text-xs text-slate-400 mb-1">
                                                <span>จ่ายแล้ว: ฿{(kpiStats.elecCost/1000000).toFixed(1)}M</span>
                                                <span>งบรวม: ฿{(kpiStats.elecBudget/1000000).toFixed(1)}M</span>
                                            </div>
                                            <div className="w-full bg-slate-700 rounded-full h-2 relative">
                                                <div className={`h-2 rounded-full ${kpiStats.elecSpentPercent > 90 ? 'bg-rose-500' : 'bg-purple-500'}`} style={{ width: `${Math.min(kpiStats.elecSpentPercent, 100)}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-800/50 rounded-lg p-4 border border-slate-700/50">
                                    <h4 className="font-bold text-slate-300 mb-2 flex items-center">
                                        <TrendingUp className="w-5 h-5 mr-2 text-pink-400" /> พยากรณ์แนวโน้มสิ้นปี
                                    </h4>
                                    <div className="h-40 w-full mt-2">
                                        {!isYearly ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ComposedChart data={trendChartData} margin={{ top: 5, right: 0, left: -20, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                                <XAxis dataKey="name" tick={{fontSize: 9, fill: '#94a3b8'}} stroke="#475569" />
                                                <YAxis tick={{fontSize: 9, fill: '#94a3b8'}} stroke="#475569" />
                                                <Tooltip contentStyle={{backgroundColor: '#0f172a', borderColor: '#334155', color: '#f8fafc', fontSize: '11px'}} />
                                                <Bar dataKey="elec_actual" name="ใช้จริง" fill="#3b82f6" radius={[2, 2, 0, 0]} />
                                                <Bar dataKey="elec_forecast" name="พยากรณ์" fill="#3b82f6" fillOpacity={0.3} stroke="#3b82f6" strokeDasharray="3 3" radius={[2, 2, 0, 0]} />
                                                <Line type="step" dataKey="elec_kpi" name="เป้า 20%" stroke="#10b981" strokeWidth={2} dot={false} />
                                            </ComposedChart>
                                        </ResponsiveContainer>
                                        ) : (
                                            <div className="flex h-full items-center justify-center text-slate-500 text-sm">พยากรณ์ไม่ทำงานในโหมดสรุปรายปี</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {(activeCategory === 'all') && (
                        <div className="space-y-6 mb-8">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-gradient-to-br from-blue-50 to-white p-5 rounded-xl border border-blue-100 shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10"><Zap className="w-16 h-16 text-blue-600"/></div>
                                    <h4 className="text-blue-800 font-bold mb-3 flex items-center"><Zap className="w-4 h-4 mr-2"/> ภาพรวมไฟฟ้า {isYearly && '(ทั้งปี)'}</h4>
                                    <p className="text-xs text-slate-500 mb-1">{isYearly ? 'ปริมาณการใช้ทั้งหมด' : 'ปริมาณสะสมตั้งแต่ต้นปี (YTD)'}</p>
                                    <p className="text-2xl font-bold text-blue-700">{ytdStats.elec_act.toLocaleString()} <span className="text-sm font-normal">หน่วย</span></p>
                                    <p className="text-sm text-slate-600 font-medium mb-3">มูลค่าสะสม: ฿{ytdStats.elec_cost.toLocaleString()}</p>
                                    <div className="pt-3 border-t border-blue-100">
                                        <p className="text-xs text-slate-500 mb-1">เทียบกับ {comparisonPrevName}</p>
                                        {renderMoM(stats.elec_act, prevStats.elec_act, 'หน่วย')}
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-cyan-50 to-white p-5 rounded-xl border border-cyan-100 shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10"><Droplets className="w-16 h-16 text-cyan-600"/></div>
                                    <h4 className="text-cyan-800 font-bold mb-3 flex items-center"><Droplets className="w-4 h-4 mr-2"/> ภาพรวมน้ำประปา {isYearly && '(ทั้งปี)'}</h4>
                                    <p className="text-xs text-slate-500 mb-1">{isYearly ? 'ปริมาณการใช้ทั้งหมด' : 'ปริมาณสะสมตั้งแต่ต้นปี (YTD)'}</p>
                                    <p className="text-2xl font-bold text-cyan-700">{ytdStats.water_act.toLocaleString()} <span className="text-sm font-normal">ลบ.ม.</span></p>
                                    <p className="text-sm text-slate-600 font-medium mb-3">มูลค่าสะสม: ฿{ytdStats.water_cost.toLocaleString()}</p>
                                    <div className="pt-3 border-t border-cyan-100">
                                        <p className="text-xs text-slate-500 mb-1">เทียบกับ {comparisonPrevName}</p>
                                        {renderMoM(stats.water_act, prevStats.water_act, 'ลบ.ม.')}
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-orange-50 to-white p-5 rounded-xl border border-orange-100 shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10"><Fuel className="w-16 h-16 text-orange-600"/></div>
                                    <h4 className="text-orange-800 font-bold mb-3 flex items-center"><Fuel className="w-4 h-4 mr-2"/> ภาพรวมน้ำมัน {isYearly && '(ทั้งปี)'}</h4>
                                    <p className="text-xs text-slate-500 mb-1">{isYearly ? 'ปริมาณการใช้ทั้งหมด' : 'ปริมาณสะสมตั้งแต่ต้นปี (YTD)'}</p>
                                    <p className="text-2xl font-bold text-orange-700 mb-8">{ytdStats.oil_total.toLocaleString()} <span className="text-sm font-normal">ลิตร</span></p>
                                    <div className="pt-3 border-t border-orange-100">
                                        <p className="text-xs text-slate-500 mb-1">เทียบกับ {comparisonPrevName}</p>
                                        {renderMoM(stats.oil_total, prevStats.oil_total, 'ลิตร')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {(activeCategory === 'all' || activeCategory === 'elec') && (
                        <section className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex items-center justify-between mb-4 border-b pb-2">
                                <div className="flex items-center text-blue-600">
                                    <Zap className="w-6 h-6 mr-2 text-yellow-500" />
                                    <h3 className="text-lg font-bold">ข้อมูลการใช้ไฟฟ้า {isYearly ? '(รวมทั้งปี)' : `(เฉพาะเดือน ${month})`}</h3>
                                </div>

                                                    <YAxis />
                                                    <Tooltip cursor={{fill: 'transparent'}} />
                                                    <Legend />
                                                    <Bar dataKey="oil_op_diesel" name="ปฏิบัติการ-ดีเซล" stackId="a" fill="#f97316" />
                                                    <Bar dataKey="oil_op_benzene" name="ปฏิบัติการ-เบนซิน" stackId="a" fill="#fbbf24" />
                                                    <Bar dataKey="oil_op_aviation" name="ปฏิบัติการ-อากาศยาน" stackId="a" fill="#ef4444" />
                                                    <Bar dataKey="oil_adm_diesel" name="ธุรการ-ดีเซล" stackId="a" fill="#8b5cf6" />
                                                    <Bar dataKey="oil_adm_benzene" name="ธุรการ-เบนซิน" stackId="a" fill="#ec4899" radius={[4, 4, 0, 0]} />

                                                <BarChart data={chartData}>

                                                    <Tooltip cursor={{fill: 'transparent'}} />
                                                    <Legend />
                                                    <Bar dataKey="oil_actual" name="ปริมาณน้ำมันรวม (ลิตร)" fill="#f97316" radius={[4, 4, 0, 0]} />

                                                    <th className="p-3 border-b border-slate-200 text-center border-l border-slate-200" colSpan={3}>ปฏิบัติการ (ลิตร)</th>
                                                    <th className="p-3 border-b border-slate-200 text-center border-l border-slate-200" colSpan={2}>ธุรการ (ลิตร)</th>
                                                    <th className="p-3 border-b border-slate-200 text-right border-l border-slate-200" rowSpan={2}>รวมทั้งหมด (ลิตร)</th>
                                                </tr>
                                                <tr className="bg-slate-50 text-slate-500 text-xs">
                                                    <th className="p-2 border-b border-slate-200 border-l border-slate-200 text-right">ดีเซล</th>
                                                    <th className="p-2 border-b border-slate-200 text-right">เบนซิน</th>
                                                    <th className="p-2 border-b border-slate-200 text-right">อากาศยาน</th>
                                                    <th className="p-2 border-b border-slate-200 border-l border-slate-200 text-right">ดีเซล</th>
                                                    <th className="p-2 border-b border-slate-200 text-right">เบนซิน</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {chartData.map(row => {
                                                    if(row.oil_actual === 0) return null;
                                                    return (
                                                        <tr key={row.name} className="hover:bg-slate-50 transition-colors">
                                                            <td className="p-3 font-medium text-slate-800">{row.name}</td>
                                                            <td className="p-3 text-right text-slate-600 border-l border-slate-100">{row.oil_op_diesel.toLocaleString()}</td>
                                                            <td className="p-3 text-right text-slate-600">{row.oil_op_benzene.toLocaleString()}</td>
                                                            <td className="p-3 text-right text-slate-600">{row.oil_op_aviation.toLocaleString()}</td>
                                                            <td className="p-3 text-right text-slate-600 border-l border-slate-100">{row.oil_adm_diesel.toLocaleString()}</td>
                                                            <td className="p-3 text-right text-slate-600">{row.oil_adm_benzene.toLocaleString()}</td>
                                                            <td className="p-3 text-right font-bold text-orange-600 border-l border-slate-100">{row.oil_actual.toLocaleString()}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </section>
                    )}

            );
        }

        function DataEntryForm({ data, onSave, currentUser, globalMonth, selectedYear, hierarchy, onAddLog, showModal }) {
            const [selectedUnit, setSelectedUnit] = useState(currentUser.role === 'admin' ? hierarchy.leaves[0] : currentUser.unit);
            const [entryMonth, setEntryMonth] = useState(globalMonth === 'สรุปรายปี' ? 'ม.ค.' : globalMonth);
            const [showSuccess, setShowSuccess] = useState(false);
            const [attachedFiles, setAttachedFiles] = useState({ elec: null, water: null, oil: null });

            const [formData, setFormData] = useState({
                elec_std: '', elec_act: '', elec_cost: '',
                water_std: '', water_act: '', water_cost: '',
                oil_op_diesel: '', oil_op_benzene: '', oil_op_aviation: '',
                oil_adm_diesel: '', oil_adm_benzene: ''
            });

            useEffect(() => {
                const existing = data.find(d => d.unit === selectedUnit && d.month === entryMonth && d.year === selectedYear);
                if (existing && existing.status === 'submitted') {
                    setFormData({
                        elec_std: existing.electricity?.standard || '', elec_act: existing.electricity?.actual || '', elec_cost: existing.electricity?.cost || '',
                        water_std: existing.water?.standard || '', water_act: existing.water?.actual || '', water_cost: existing.water?.cost || '',
                        oil_op_diesel: existing.oil?.operational?.diesel || '', oil_op_benzene: existing.oil?.operational?.benzene || '', oil_op_aviation: existing.oil?.operational?.aviation || '',
                        oil_adm_diesel: existing.oil?.administrative?.diesel || '', oil_adm_benzene: existing.oil?.administrative?.benzene || ''
                    });
                } else {
                    setFormData({
                        elec_std: '', elec_act: '', elec_cost: '',
                        water_std: '', water_act: '', water_cost: '',
                        oil_op_diesel: '', oil_op_benzene: '', oil_op_aviation: '',
                        oil_adm_diesel: '', oil_adm_benzene: ''
                    });
                }
            }, [selectedUnit, entryMonth, selectedYear, data]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };
            
            const handleFileChange = (e, type) => {
                const file = e.target.files[0];
                if (file) {
                    setAttachedFiles(prev => ({ ...prev, [type]: file.name }));
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const payload = {
                    unit: selectedUnit,
                    month: entryMonth,
                    year: selectedYear,
                    electricity: {
                        standard: Number(formData.elec_std) || 0,
                        actual: Number(formData.elec_act) || 0,
                        cost: Number(formData.elec_cost) || 0,
                    },
                    water: {
                        standard: Number(formData.water_std) || 0,
                        actual: Number(formData.water_act) || 0,
                        cost: Number(formData.water_cost) || 0,
                    },
                    oil: {
                        operational: {
                            diesel: Number(formData.oil_op_diesel) || 0,
                            benzene: Number(formData.oil_op_benzene) || 0,
                            aviation: Number(formData.oil_op_aviation) || 0,
                        },
                        administrative: {
                            diesel: Number(formData.oil_adm_diesel) || 0,
                            benzene: Number(formData.oil_adm_benzene) || 0,
                        }
                    }
                };
                await onSave(payload);
                onAddLog('บันทึกข้อมูลรายงาน', `ส่งรายงานของหน่วย ${selectedUnit} ประจำเดือน ${entryMonth}`);
                setShowSuccess(true);
                setTimeout(() => setShowSuccess(false), 3000);

            return (

                        <h3 className="font-bold text-lg flex items-center"><FileEdit className="w-5 h-5 mr-2"/> แบบฟอร์มบันทึกข้อมูลการใช้พลังงาน</h3>
                    </div>
