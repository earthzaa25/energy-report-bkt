                        <div className="flex space-x-4 p-4 bg-slate-50 rounded-lg border border-slate-200">
                            <div className="flex-1">
                                <label className="block text-sm font-medium text-slate-700 mb-1">หน่วยงานที่รายงาน</label>
                                {currentUser.role === 'admin' ? (
                                    <select value={selectedUnit} onChange={(e) => setSelectedUnit(e.target.value)} className="w-full border border-slate-300 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                                        {hierarchy.parents.map(parent => (
                                            <optgroup key={parent} label={hierarchy.dict[parent].length > 1 ? `กลุ่ม ${parent}` : parent}>
                                                {hierarchy.dict[parent].map(u => <option key={u} value={u}>{u}</option>)}
                                            </optgroup>
                                        ))}
                                    </select>
                                ) : (
                                    <div className="w-full border border-slate-300 rounded p-2 bg-slate-100 text-slate-600 cursor-not-allowed">
                                        {currentUser.unit}
                                    </div>
                                )}
                            </div>
                            <div className="flex-1">
                                <label className="block text-sm font-medium text-slate-700 mb-1">ประจำเดือน / ปี</label>
                                <div className="flex space-x-2">
                                    <select value={entryMonth} onChange={(e) => setEntryMonth(e.target.value)} className="w-1/2 border border-slate-300 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                                        {MONTHS.map(m => <option key={m} value={m}>เดือน {m}</option>)}
                                    </select>
                                    <div className="w-1/2 border border-slate-300 rounded p-2 bg-slate-100 text-slate-600">
                                        ปีงบฯ {selectedYear}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <div className="border border-slate-200 rounded p-4 bg-blue-50/30">
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-bold text-blue-600 flex items-center"><Zap className="w-4 h-4 mr-2"/> ไฟฟ้า</h4>
                                        <label className="cursor-pointer text-xs flex items-center bg-white border border-blue-200 text-blue-600 px-2 py-1 rounded hover:bg-blue-50">
                                            <Upload className="w-3 h-3 mr-1" /> แนบหลักฐาน (บิล)
                                            <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileChange(e, 'elec')} />
                                        </label>
                                    </div>
                                    {attachedFiles.elec && <p className="text-xs text-emerald-600 mb-2 border-b border-blue-100 pb-2">✓ แนบไฟล์: {attachedFiles.elec}</p>}
                                    <div className="space-y-3">
                                        <div><label className="text-sm text-slate-600 block">ค่ากลาง (หน่วย)</label><input type="number" name="elec_std" value={formData.elec_std} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                        <div><label className="text-sm text-slate-600 block">ใช้จริง (หน่วย)</label><input type="number" name="elec_act" value={formData.elec_act} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                        <div><label className="text-sm text-slate-600 block">คิดเป็นเงิน (บาท)</label><input type="number" name="elec_cost" value={formData.elec_cost} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                    </div>
                                </div>

                                <div className="border border-slate-200 rounded p-4 bg-cyan-50/30">
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-bold text-cyan-600 flex items-center"><Droplets className="w-4 h-4 mr-2"/> น้ำประปา</h4>
                                        <label className="cursor-pointer text-xs flex items-center bg-white border border-cyan-200 text-cyan-600 px-2 py-1 rounded hover:bg-cyan-50">
                                            <Upload className="w-3 h-3 mr-1" /> แนบหลักฐาน (บิล)
                                            <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileChange(e, 'water')} />
                                        </label>
                                    </div>
                                    {attachedFiles.water && <p className="text-xs text-emerald-600 mb-2 border-b border-cyan-100 pb-2">✓ แนบไฟล์: {attachedFiles.water}</p>}
                                    <div className="space-y-3">
                                        <div><label className="text-sm text-slate-600 block">ค่ากลาง (ลบ.ม.)</label><input type="number" name="water_std" value={formData.water_std} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                        <div><label className="text-sm text-slate-600 block">ใช้จริง (ลบ.ม.)</label><input type="number" name="water_act" value={formData.water_act} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                        <div><label className="text-sm text-slate-600 block">คิดเป็นเงิน (บาท)</label><input type="number" name="water_cost" value={formData.water_cost} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                    </div>
                                </div>
                            </div>

                            <div className="border border-slate-200 rounded p-4 h-fit bg-orange-50/30">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-bold text-orange-600 flex items-center"><Fuel className="w-4 h-4 mr-2"/> น้ำมันเชื้อเพลิง (ลิตร)</h4>
                                    <label className="cursor-pointer text-xs flex items-center bg-white border border-orange-200 text-orange-600 px-2 py-1 rounded hover:bg-orange-50">
                                        <Upload className="w-3 h-3 mr-1" /> แนบเอกสารเบิก
                                        <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileChange(e, 'oil')} />
                                    </label>
                                </div>
                                {attachedFiles.oil && <p className="text-xs text-emerald-600 mb-4 border-b border-orange-100 pb-2">✓ แนบไฟล์: {attachedFiles.oil}</p>}
                                
                                <h5 className="font-semibold text-slate-700 bg-white border border-slate-200 p-2 rounded mb-2">1. น้ำมันปฏิบัติการ</h5>
                                <div className="space-y-3 mb-6 px-2">
                                    <div><label className="text-sm text-slate-600 block">ดีเซล</label><input type="number" name="oil_op_diesel" value={formData.oil_op_diesel} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                    <div><label className="text-sm text-slate-600 block">เบนซิน</label><input type="number" name="oil_op_benzene" value={formData.oil_op_benzene} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                    <div><label className="text-sm text-slate-600 block">อากาศยาน</label><input type="number" name="oil_op_aviation" value={formData.oil_op_aviation} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                </div>

                                <h5 className="font-semibold text-slate-700 bg-white border border-slate-200 p-2 rounded mb-2">2. น้ำมันธุรการ</h5>
                                <div className="space-y-3 px-2">
                                    <div><label className="text-sm text-slate-600 block">ดีเซล</label><input type="number" name="oil_adm_diesel" value={formData.oil_adm_diesel} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                    <div><label className="text-sm text-slate-600 block">เบนซิน</label><input type="number" name="oil_adm_benzene" value={formData.oil_adm_benzene} onChange={handleChange} required className="w-full border rounded p-1.5" /></div>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end pt-4 border-t border-slate-200 items-center">
                            {showSuccess && <span className="text-emerald-600 font-medium mr-4 flex items-center"><CheckCircle2 className="w-4 h-4 mr-1"/> บันทึกข้อมูลเข้า Google Sheets เรียบร้อย</span>}
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 flex items-center">
                                <Save className="w-4 h-4 mr-2" /> บันทึกและส่งรายงาน
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // --- Status Tracking View ---
        function StatusTracking({ data, month, year, hierarchy, showModal }) {
            const currentMonthData = data.filter(d => d.month === month && d.year === year);
            const submittedCount = currentMonthData.filter(d => d.status === 'submitted').length;
            const pendingUnits = currentMonthData.filter(d => d.status === 'pending');

            const handleLineNotify = () => {
                if (pendingUnits.length === 0) return showModal({title: 'การแจ้งเตือน', message: 'ทุกหน่วยงานส่งรายงานครบถ้วนแล้ว\nไม่มีรายการต้องแจ้งเตือนครับ', type: 'alert'});
                const unitNames = pendingUnits.map(u => u.unit).join('\n- ');
                const msg = `[ระบบรายงานพลังงาน บก.ทท.]\nแจ้งเตือนประจำเดือน ${month} ปีงบฯ ${year}\n\nขณะนี้มี ${pendingUnits.length} หน่วยงานที่ยังไม่ได้ส่งรายงาน ได้แก่:\n- ${unitNames}\n\nโปรดเร่งดำเนินการบันทึกข้อมูลในระบบผ่านเว็บเบราว์เซอร์`;
                showModal({
                    title: 'จำลองการส่ง LINE Notify สำเร็จ!', 
                    message: `ข้อความที่จะถูกส่งไปยังกลุ่ม LINE:\n\n${msg}`,
                    type: 'alert'
                });
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex justify-end no-print">
                        <button onClick={handleLineNotify} className="bg-[#00B900] hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium flex items-center shadow-sm">
                            <MessageCircle className="w-5 h-5 mr-2" /> ส่งแจ้งเตือนผ่าน LINE (ทวงรายงาน)
                        </button>
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 text-center"><h4 className="text-slate-500 mb-1">หน่วยย่อยทั้งหมด (ที่ต้องรายงาน)</h4><p className="text-3xl font-bold">{hierarchy.leaves.length}</p></div>
                        <div className="bg-emerald-50 p-4 rounded-lg shadow-sm border border-emerald-100 text-center"><h4 className="text-emerald-600 mb-1">รายงานแล้ว</h4><p className="text-3xl font-bold text-emerald-700">{submittedCount}</p></div>
                        <div className="bg-rose-50 p-4 rounded-lg shadow-sm border border-rose-100 text-center"><h4 className="text-rose-600 mb-1">ยังไม่รายงาน</h4><p className="text-3xl font-bold text-rose-700">{pendingUnits.length}</p></div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center"><h3 className="font-bold text-slate-700">สถานะการส่งรายงาน เดือน {month} ปีงบฯ {year}</h3></div>
                        <table className="w-full text-left">
                            <thead>
                                <tr className="bg-slate-100 text-slate-500 text-sm border-b">
                                    <th className="px-6 py-3 font-medium">สังกัดหน่วยแม่</th>
                                    <th className="px-6 py-3 font-medium">หน่วยงานย่อย</th>
                                    <th className="px-6 py-3 font-medium text-center">สถานะ</th>
                                    <th className="px-6 py-3 font-medium text-right">การจัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {hierarchy.parents.map(parent => {
                                    return hierarchy.dict[parent].map((child, index) => {
                                        const rowData = currentMonthData.find(d => d.unit === child);
                                        if(!rowData) return null;
                                        return (
                                            <tr key={rowData.id} className="hover:bg-slate-50">
                                                {index === 0 && <td rowSpan={hierarchy.dict[parent].length} className="px-6 py-4 font-bold text-slate-800 bg-slate-50/50 border-r border-slate-100 align-top">{parent}</td>}
                                                <td className="px-6 py-4 font-medium text-slate-700">{rowData.unit}</td>
                                                <td className="px-6 py-4 text-center">
                                                    {rowData.status === 'submitted' ? <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800"><CheckCircle2 className="w-3 h-3 mr-1" /> ส่งแล้ว</span> : <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800"><XCircle className="w-3 h-3 mr-1" /> ค้างส่ง</span>}
                                                </td>
                                                <td className="px-6 py-4 text-right">
                                                    {rowData.status === 'pending' ? <button onClick={handleLineNotify} className="text-sm font-medium text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-1 rounded">แจ้งเตือน</button> : <span className="text-sm text-slate-400">ครบถ้วน</span>}
                                                </td>
                                            </tr>
                                        );
                                    });
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function ReportExport({ data, month, year, hierarchy, currentUser }) {
            const [reportType, setReportType] = useState('table');
            const isYearly = month === 'สรุปรายปี';
            const currentData = data.filter(d => d.year === year && (isYearly ? true : d.month === month) && d.status === 'submitted');
            const grandTotals = aggregateTotals(currentData);

            const exportCSV = () => {

            const showModal = (config) => setModalConfig({ ...config, isOpen: true });
            const hideModal = () => setModalConfig({ isOpen: false });

            const hierarchy = useMemo(() => ({
                dict: unitHierarchy,
                parents: Object.keys(unitHierarchy),
                leaves: Object.values(unitHierarchy).flat()
            }), [unitHierarchy]);

            // ดึงข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
            useEffect(() => {
                fetch(GOOGLE_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data.settings) {
                            if (data.settings.hierarchy) setUnitHierarchy(data.settings.hierarchy);
                            if (data.settings.passwords) setUnitPasswords(data.settings.passwords);
                            
                            // แตกข้อมูล Standards ออกตามปี
                            const loadedStandards = {};
                            Object.keys(data.settings).forEach(key => {
                                if (key.startsWith('standards_')) {
                                    const year = key.replace('standards_', '');
                                    loadedStandards[year] = data.settings[key];
                                }
                            });
                            setStandards(loadedStandards);
                        }
                        
                        if (data.reports) setDbData(data.reports);
                        if (data.logs) {
                            data.logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                            setLogs(data.logs);
                        }
                        
                        setIsDbConnected(true);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error("Error loading data from Google Sheets:", err);
                        setIsLoading(false);
                    });
            }, []);

            // รวมข้อมูลเข้าด้วยกันและสร้างบรรทัด "ยังไม่รายงาน (Pending)" อัตโนมัติ
            const appData = useMemo(() => {
                const merged = [];
                hierarchy.leaves.forEach(unit => {
                    YEARS.forEach(year => {
                        MONTHS.forEach(month => {
                            const id = `${unit}-${month}-${year}`;
                            const existing = dbData.find(d => d.id === id);
                            
                            if (existing) {
                                // ดึงค่ามาตรฐานมาใส่
                                if (standards[year] && standards[year][unit]) {
                                    if (existing.electricity) existing.electricity.standard = Number(standards[year][unit].elec) || 0;
                                    if (existing.water) existing.water.standard = Number(standards[year][unit].water) || 0;
                                }
                                merged.push(existing);
                            } else {
                                // ถ้ายังไม่มีข้อมูล ให้สร้าง Template สถานะ Pending ขึ้นมาแทน
                                merged.push({
                                    id, unit, month, year, status: 'pending',
                                    electricity: null, water: null, oil: null
                                });
                            }
                        });
                    });
                });
                return merged;
            }, [dbData, hierarchy.leaves, standards]);

            const [currentView, setCurrentView] = useState('dashboard');
            const [activeCategory, setActiveCategory] = useState('all'); 
            const [selectedUnit, setSelectedUnit] = useState('overall');
            const [selectedMonth, setSelectedMonth] = useState('สรุปรายปี');
            const [selectedYear, setSelectedYear] = useState('2569'); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            useEffect(() => { if (currentView === 'tracking' && selectedMonth === 'สรุปรายปี') setSelectedMonth('เม.ย.'); }, [currentView, selectedMonth]);

            const handleLogin = (role, unit) => {
                setCurrentUser({ role, unit });
                if (role === 'user') { setSelectedUnit(unit); setCurrentView('data_entry'); if(selectedMonth === 'สรุปรายปี') setSelectedMonth('ม.ค.'); }
                else { setSelectedUnit('overall'); setCurrentView('dashboard'); }
            };

            const handlePrint = () => window.print();

            // ฟังก์ชันกลางในการส่ง POST Request ไปยัง Google Sheets
            const postToGoogleSheets = async (action, dataPayload, key = null) => {
                const payload = { action, data: dataPayload };
                if (key) payload.key = key;
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Save failed:", e);
                    throw new Error("เกิดข้อผิดพลาดในการบันทึกข้อมูลไปยัง Google Sheets");
                }
            };

            const addAuditLog = async (action, details) => {
                const newLog = {
                    id: Date.now().toString(), timestamp: new Date().toLocaleString('th-TH'),
                    user: currentUser?.role === 'admin' ? 'ผู้ดูแลระบบ' : (currentUser?.role === 'executive' ? 'ผู้บริหาร' : currentUser?.unit),
                    role: currentUser?.role, action, details
                };
                setLogs(prev => [newLog, ...prev]);
                await postToGoogleSheets('addLog', newLog);
            };

            const handleSaveData = async (newData) => {
                const id = `${newData.unit}-${newData.month}-${newData.year}`;
                const payload = { ...newData, id, status: 'submitted' };
                
                // อัปเดต UI ทันที
                setDbData(prev => {
                    const index = prev.findIndex(d => d.id === id);
                    if (index !== -1) { const updated = [...prev]; updated[index] = payload; return updated; }
                    return [...prev, payload];
                });
                
                // ส่งไปบันทึก
                await postToGoogleSheets('saveReport', payload);
            };

            const handleUpdateStandards = async (targetYear, newStandards) => {
                setStandards(prev => ({...prev, [targetYear]: newStandards}));
                await postToGoogleSheets('saveSettings', newStandards, `standards_${targetYear}`);
                showModal({title: 'สำเร็จ', message: `บันทึกการตั้งค่า "ค่ากลาง" สำหรับปีงบประมาณ ${targetYear} เรียบร้อยแล้ว!`, type: 'alert'});
            };

            const handleUpdateHierarchy = async (newDict) => {
                setUnitHierarchy(newDict);
                await postToGoogleSheets('saveSettings', newDict, 'hierarchy');
            };

            const handleUpdatePasswords = async (newPwds) => {
                setUnitPasswords(newPwds);
                addAuditLog('ตั้งค่ารหัสผ่าน', 'อัปเดตรหัสผ่านของหน่วยงาน');
                await postToGoogleSheets('saveSettings', newPwds, 'passwords');
                showModal({title: 'สำเร็จ', message: 'บันทึกรหัสผ่านลงฐานข้อมูลเรียบร้อยแล้ว', type: 'alert'});
            };

            if (isLoading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-50 flex-col">
                        <div className="loader mb-4"></div>
                        <h2 className="text-xl font-bold text-slate-700">กำลังเชื่อมต่อกับฐานข้อมูล...</h2>
                        <p className="text-slate-500 mt-2 text-sm">ระบบกำลังดึงข้อมูลจาก Google Sheets ของคุณ</p>
                    </div>
                );
            }

            if (!currentUser) return <LoginScreen onLogin={handleLogin} hierarchy={hierarchy} unitPasswords={unitPasswords} />;

            const renderContent = () => {
                if (currentView === 'tracking') return <StatusTracking data={appData} month={selectedMonth} year={selectedYear} hierarchy={hierarchy} showModal={showModal} />;
                if (currentView === 'report') return <ReportExport data={appData} month={selectedMonth} year={selectedYear} hierarchy={hierarchy} currentUser={currentUser} />;
                if (currentView === 'data_entry') return <DataEntryForm data={appData} onSave={handleSaveData} currentUser={currentUser} selectedYear={selectedYear} globalMonth={selectedMonth} hierarchy={hierarchy} onAddLog={addAuditLog} showModal={showModal} />;
                if (currentView === 'standard_settings') return <StandardSettings data={appData} year={selectedYear} onUpdateStandards={handleUpdateStandards} hierarchy={hierarchy} onAddLog={addAuditLog} showModal={showModal} />;
                if (currentView === 'unit_settings') return <UnitSettings hierarchy={hierarchy} onUpdateHierarchy={handleUpdateHierarchy} unitPasswords={unitPasswords} onUpdatePasswords={handleUpdatePasswords} onAddLog={addAuditLog} showModal={showModal} />;
                if (currentView === 'audit_logs') return <AuditLogs logs={logs} />;
                return <Dashboard unit={selectedUnit} month={selectedMonth} year={selectedYear} data={appData} activeCategory={activeCategory} hierarchy={hierarchy} currentUser={currentUser} />;
            };

            return (
                <div className="flex h-screen bg-slate-100 text-slate-800">
                    <Modal {...modalConfig} onClose={hideModal} />
                    <aside className={`bg-slate-900 text-slate-300 w-64 flex-shrink-0 transition-all duration-300 ${isSidebarOpen ? 'block' : 'hidden'} no-print flex flex-col`}>
                        <div className="p-4 bg-slate-950 text-white flex items-center justify-between">
                            <h1 className="text-xl font-bold text-yellow-500">รายงานพลังงาน<br/><span className="text-sm font-normal text-slate-300">บก.ทท.</span></h1>
                        </div>
                        <div className="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                            <div className="text-sm">
                                <p className="text-slate-400 text-xs">เข้าสู่ระบบโดย:</p>
                                <p className="font-medium text-white text-xs mt-0.5 px-2 py-0.5 rounded bg-slate-700 inline-block truncate max-w-[150px]" title={currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : currentUser.role === 'executive' ? 'ผู้บริหาร (Executive)' : `หน่วย: ${currentUser.unit}`}>
                                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : currentUser.role === 'executive' ? 'ผู้บริหาร (Executive)' : `หน่วย: ${currentUser.unit}`}
                                </p>
                            </div>
                            <button onClick={() => setCurrentUser(null)} title="ออกจากระบบ" className="text-slate-400 hover:text-rose-400"><LogOut className="w-5 h-5" /></button>
                        </div>
                        <nav className="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                            <p className="text-xs uppercase tracking-wider text-slate-500 mb-2 mt-2">หน้าแสดงผล</p>
                            <button onClick={() => { setCurrentView('dashboard'); setActiveCategory('all'); }} className={`w-full flex items-center p-2 rounded ${currentView === 'dashboard' && activeCategory === 'all' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}>
                                <LayoutDashboard className="w-5 h-5 mr-3" /> ภาพรวม {(currentUser.role === 'admin' || currentUser.role === 'executive') ? 'บก.ทท.' : currentUser.unit}
                            </button>
                            {[ { id: 'elec', label: 'ไฟฟ้า', icon: Zap, color: 'text-yellow-400' }, { id: 'water', label: 'น้ำประปา', icon: Droplets, color: 'text-cyan-400' }, { id: 'oil', label: 'น้ำมันเชื้อเพลิง', icon: Fuel, color: 'text-orange-400' } ].map(cat => (
                                <button key={cat.id} onClick={() => { setCurrentView('dashboard'); setActiveCategory(cat.id); }} className={`w-full flex items-center p-2 rounded ${currentView === 'dashboard' && activeCategory === cat.id ? 'bg-slate-700 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'}`}>
                                    <cat.icon className={`w-5 h-5 mr-3 ${cat.color}`} /> {cat.label}
                                </button>
                            ))}
                            <p className="text-xs uppercase tracking-wider text-slate-500 mt-8 mb-2">การดำเนินการ</p>
                            {currentUser.role !== 'executive' && (
                                <button onClick={() => setCurrentView('data_entry')} className={`w-full flex items-center p-2 rounded ${currentView === 'data_entry' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}>
                                    <FileEdit className="w-5 h-5 mr-3" /> บันทึกข้อมูลรายงาน
                                </button>
                            )}
                            <button onClick={() => setCurrentView('report')} className={`w-full flex items-center p-2 rounded ${currentView === 'report' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}>
                                <Printer className="w-5 h-5 mr-3" /> ออกเอกสารรายงาน
                            </button>
                            {(currentUser.role === 'admin' || currentUser.role === 'executive') && (
                                <button onClick={() => setCurrentView('tracking')} className={`w-full flex items-center p-2 rounded ${currentView === 'tracking' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}>
                                    <ClipboardList className="w-5 h-5 mr-3" /> ติดตามสถานะ
                                </button>
                            )}
                            {currentUser.role === 'admin' && (
                                <>
                                    <p className="text-xs uppercase tracking-wider text-slate-500 mt-8 mb-2">การจัดการ (Admin)</p>
                                    <button onClick={() => setCurrentView('unit_settings')} className={`w-full flex items-center p-2 rounded ${currentView === 'unit_settings' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}><Network className="w-5 h-5 mr-3" /> จัดการรายชื่อหน่วยงาน</button>
                                    <button onClick={() => setCurrentView('standard_settings')} className={`w-full flex items-center p-2 rounded ${currentView === 'standard_settings' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}><Settings className="w-5 h-5 mr-3" /> ตั้งค่า "ค่ากลาง" (Standard)</button>
                                    <button onClick={() => setCurrentView('audit_logs')} className={`w-full flex items-center p-2 rounded ${currentView === 'audit_logs' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}><HistoryIcon className="w-5 h-5 mr-3" /> ประวัติการใช้งานระบบ</button>
                                </>
                            )}
                        </nav>
                    </aside>
                    <main className="flex-1 flex flex-col h-screen overflow-hidden print-container">
                        <header className="bg-white shadow-sm p-4 flex justify-between items-center no-print z-10 relative">
                            <div className="flex items-center">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="mr-4 p-1 hover:bg-slate-100 rounded text-slate-600"><MenuIcon className="w-6 h-6" /></button>
                                <h2 className="text-xl font-semibold text-slate-800">
                                    {currentView === 'dashboard' && 'Dashboard การใช้พลังงาน'}
                                    {currentView === 'tracking' && 'ติดตามสถานะการรายงานข้อมูล'}
                                    {currentView === 'report' && 'ส่งออกรายงานข้อมูล (Print / CSV)'}
                                    {currentView === 'data_entry' && 'แบบฟอร์มบันทึกข้อมูลการใช้พลังงาน'}
                                    {currentView === 'standard_settings' && 'การตั้งค่าค่ากลางการใช้พลังงาน'}
                                    {currentView === 'unit_settings' && 'จัดการรายชื่อและรหัสผ่านหน่วยงาน'}
                                    {currentView === 'audit_logs' && 'ประวัติการใช้งานระบบ (Audit Logs)'}
                                </h2>
                            </div>
                            <div className="flex items-center space-x-3">
                                {isDbConnected ? <div className="hidden md:flex items-center text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-full text-xs font-bold mr-2 border border-emerald-200"><Cloud className="w-3.5 h-3.5 mr-1.5" /> ใช้งานผ่าน Google Sheets แล้ว</div> : <div className="hidden md:flex items-center text-rose-500 bg-rose-50 px-3 py-1.5 rounded-full text-xs font-medium mr-2 border border-rose-200"><AlertCircle className="w-3 h-3 mr-1" /> ขาดการเชื่อมต่อ</div>}
                                {currentView === 'dashboard' && (currentUser.role === 'admin' || currentUser.role === 'executive') && (
                                    <select value={selectedUnit} onChange={(e) => setSelectedUnit(e.target.value)} className="border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium max-w-[250px] truncate">
                                        <option value="overall">รวมทุกหน่วย บก.ทท.</option>
                                        {hierarchy.parents.map(parent => (
                                            <React.Fragment key={parent}>
                                                <option value={hierarchy.dict[parent].length > 1 ? `GROUP_${parent}` : parent} className="font-bold text-blue-700">{hierarchy.dict[parent].length > 1 ? `▼ กลุ่ม ${parent}` : `▪ ${parent}`}</option>
                                                {hierarchy.dict[parent].length > 1 && hierarchy.dict[parent].map(u => <option key={`child-${u}`} value={u}>&nbsp;&nbsp;&nbsp;- {u}</option>)}
                                            </React.Fragment>
                                        ))}
                                    </select>
                                )}
                                {currentView !== 'unit_settings' && currentView !== 'audit_logs' && (
                                    <select value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)} className="border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium bg-slate-50">
                                        {YEARS.map(y => <option key={y} value={y}>ปีงบฯ {y}</option>)}
                                    </select>
                                )}
                                {currentView !== 'data_entry' && currentView !== 'standard_settings' && currentView !== 'unit_settings' && currentView !== 'audit_logs' && (
                                    <select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                                        {(currentView === 'dashboard' || currentView === 'report') && <option value="สรุปรายปี" className="font-bold text-blue-600">สรุปรายปี (ทุกเดือน)</option>}
                                        {MONTHS.map(m => <option key={m} value={m}>เดือน {m}</option>)}
                                    </select>
                                )}
                                {currentView !== 'tracking' && currentView !== 'data_entry' && currentView !== 'standard_settings' && currentView !== 'unit_settings' && currentView !== 'audit_logs' && (
                                    <button onClick={handlePrint} className="flex items-center bg-slate-800 text-white px-4 py-1.5 rounded-md hover:bg-slate-900 transition-colors"><Printer className="w-4 h-4 mr-2" /> พิมพ์</button>
                                )}
                            </div>
                        </header>
                        <div className="flex-1 overflow-auto bg-slate-50 p-6 relative custom-scrollbar">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnergyReportApp />);
    </script>
</body>
</html>
