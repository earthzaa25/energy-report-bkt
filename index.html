                            <button onClick={handleSaveAdmins} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg flex items-center text-sm font-bold transition-colors w-full sm:w-auto justify-center"><Save className="w-4 h-4 mr-2"/> บันทึกข้อมูล Admin</button>
                        </div>
                        <div className="p-6 bg-slate-50/50">
                            {renderUserList(localAdmins, setLocalAdmins, newAdmin, setNewAdmin)}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-[#1e293b] px-6 py-4 flex flex-col sm:flex-row justify-between items-center text-white gap-3 sm:gap-0">
                            <h3 className="font-bold text-base flex items-center"><Briefcase className="w-5 h-5 mr-2 text-yellow-400"/> 2. บัญชีผู้บริหาร (Executive)</h3>
                            <button onClick={handleSaveExecs} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg flex items-center text-sm font-bold transition-colors w-full sm:w-auto justify-center"><Save className="w-4 h-4 mr-2"/> บันทึกข้อมูล Executive</button>
                        </div>
                        <div className="p-6 bg-slate-50/50">
                            {renderUserList(localExecs, setLocalExecs, newExec, setNewExec)}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-[#1e293b] px-6 py-4 flex flex-col sm:flex-row justify-between items-center text-white gap-3 sm:gap-0">
                            <h3 className="font-bold text-base flex items-center"><Building2Icon className="w-5 h-5 mr-2 text-emerald-400"/> 3. รหัสผ่านหน่วยงานปฏิบัติการ (User)</h3>
                            <button onClick={handleSaveUnits} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg flex items-center text-sm font-bold transition-colors w-full sm:w-auto justify-center"><Save className="w-4 h-4 mr-2"/> บันทึกรหัสผ่านหน่วยงาน</button>
                        </div>
                        <div className="p-6 bg-slate-50/50">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {hierarchy.leaves.map(u => (
                                    <div key={`pwd-${u}`} className="flex justify-between items-center bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-emerald-300 transition-colors">
                                        <span className="text-[13px] font-bold text-slate-700 truncate mr-3" title={u}>{u}</span>
                                        <div className="flex items-center space-x-1">
                                            <input type="password" placeholder="••••••••" value={tempPwds[u] || ''} onChange={(e) => setTempPwds(prev => ({ ...prev, [u]: e.target.value }))} className="border border-slate-300 rounded-lg p-1.5 text-[13px] w-24 text-center focus:ring-2 focus:ring-emerald-500 bg-slate-50 outline-none" />
                                            <button type="button" onClick={async () => {
                                                if(!tempPwds[u]) return;
                                                const hashed = await hashPassword(tempPwds[u]);
                                                setLocalUnits(prev => ({ ...prev, [u]: hashed }));
                                                const t = {...tempPwds}; delete t[u]; setTempPwds(t);
                                                showModal({title:'พักข้อมูลสำเร็จ', message:`เปลี่ยนรหัสผ่านชั่วคราวให้หน่วย ${u} แล้ว\nอย่าลืมกด "บันทึกรหัสผ่านหน่วยงาน" มุมขวาบนเพื่อยืนยันอีกครั้ง`, type:'alert'});
                                            }} className="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-1.5 rounded-lg text-[11px] font-bold hover:bg-emerald-600 hover:text-white transition-colors">✔</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ unit, month, year, data, activeCategory, hierarchy, currentUser }) {
            const [viewMode, setViewMode] = useState('chart'); 
            const [comparisonMode, setComparisonMode] = useState('mom'); 
            
            const isGroup = unit.startsWith('GROUP_');
            const actualUnit = isGroup ? unit.replace('GROUP_', '') : unit;
            const isYearly = month === 'สรุปรายปี';

            const displayUnits = useMemo(() => {
                if (unit === 'overall') return hierarchy.leaves;
                if (isGroup) return hierarchy.dict[actualUnit];
                return [unit];
            }, [unit, isGroup, actualUnit, hierarchy]);

            const currentData = useMemo(() => {
                return data.filter(d => d.year === year && (isYearly ? true : d.month === month) && displayUnits.includes(d.unit) && d.status === 'submitted');
            }, [data, month, year, displayUnits, isYearly]);

            const stats = useMemo(() => aggregateTotals(currentData), [currentData]);

            const prevStats = useMemo(() => {
                const monthIndex = MONTHS.indexOf(month);
                let pMonth, pYear;
                
                if (isYearly) { pMonth = null; pYear = (parseInt(year) - 1).toString(); } 
                else {
                    if (comparisonMode === 'mom') {
                        pMonth = monthIndex === 0 ? MONTHS[11] : MONTHS[monthIndex - 1];
                        pYear = monthIndex === 0 ? (parseInt(year) - 1).toString() : year;
                    } else { pMonth = month; pYear = (parseInt(year) - 1).toString(); }
                }
                
                const pData = data.filter(d => d.year === pYear && (isYearly ? true : d.month === pMonth) && displayUnits.includes(d.unit) && d.status === 'submitted');
                return aggregateTotals(pData);
            }, [data, month, year, displayUnits, isYearly, comparisonMode]);

            const ytdStats = useMemo(() => {
                if (isYearly) return stats; 
                const monthIndex = MONTHS.indexOf(month);
                const validMonths = MONTHS.slice(0, monthIndex + 1);
                const yData = data.filter(d => d.year === year && validMonths.includes(d.month) && displayUnits.includes(d.unit) && d.status === 'submitted');
                return aggregateTotals(yData);
            }, [data, month, year, displayUnits, isYearly, stats]);

            const kpiStats = useMemo(() => {
                const targetElec = ytdStats.elec_std * 0.8;
                const targetWater = ytdStats.water_std * 0.8;
                const elecPass = ytdStats.elec_act <= targetElec;
                const waterPass = ytdStats.water_act <= targetWater;
                const elecPercent = ytdStats.elec_std > 0 ? (ytdStats.elec_act / ytdStats.elec_std) * 100 : 0;
                const waterPercent = ytdStats.water_std > 0 ? (ytdStats.water_act / ytdStats.water_std) * 100 : 0;
                const elecBudget = (ytdStats.elec_std > 0 && ytdStats.elec_act > 0) ? (ytdStats.elec_cost / ytdStats.elec_act) * ytdStats.elec_std * 12 : (ytdStats.elec_std * 12 * 5); 
                const elecSpentPercent = elecBudget > 0 ? (ytdStats.elec_cost / elecBudget) * 100 : 0;
                return { targetElec, targetWater, elecPass, waterPass, elecPercent, waterPercent, elecBudget, elecCost: ytdStats.elec_cost, elecSpentPercent };
            }, [ytdStats]);

            const trendChartData = useMemo(() => {
                if (activeCategory !== 'all' || isYearly) return [];
                const leavesToSum = unit === 'overall' ? hierarchy.leaves : (isGroup ? hierarchy.dict[actualUnit] : [unit]);
                const averages = { elec: 0, water: 0 };
                let totalSubmittedMonths = 0;
                
                const monthlyData = MONTHS.map(m => {
                    const dList = data.filter(item => item.year === year && item.month === m && leavesToSum.includes(item.unit) && item.status === 'submitted');
                    let elec_actual = 0, elec_std = 0, isSubmitted = false;
                    if (dList.length > 0) {
                        isSubmitted = true; totalSubmittedMonths++;
                        const totals = aggregateTotals(dList);
                        elec_actual = totals.elec_act; elec_std = totals.elec_std; averages.elec += elec_actual;
                    } else {
                         const prevList = data.filter(item => item.year === year && item.month === MONTHS[0] && leavesToSum.includes(item.unit));
                         if (prevList.length > 0) elec_std = aggregateTotals(prevList).elec_std;
                    }
                    return { name: m, isSubmitted, elec_actual: isSubmitted ? elec_actual : null, elec_std };
                });

                if (totalSubmittedMonths > 0) averages.elec /= totalSubmittedMonths;
                return monthlyData.map(d => ({ ...d, elec_forecast: !d.isSubmitted ? averages.elec : null, elec_kpi: d.elec_std * 0.8 }));
            }, [data, unit, year, isGroup, actualUnit, hierarchy, activeCategory, isYearly]);

            const leaderboard = useMemo(() => {
                if (unit !== 'overall') return []; 
                const unitStats = hierarchy.leaves.map(u => {
                    const uData = data.filter(d => d.year === year && (isYearly ? true : d.month === month) && d.unit === u && d.status === 'submitted');
                    const totals = aggregateTotals(uData);
                    const savingPercent = totals.elec_std > 0 ? ((totals.elec_act - totals.elec_std) / totals.elec_std) * 100 : 0;
                    return { unit: u, percent: savingPercent, actual: totals.elec_act, std: totals.elec_std };
                }).filter(u => u.std > 0); 
                unitStats.sort((a, b) => a.percent - b.percent);
                return unitStats.slice(0, 5);
            }, [data, year, month, isYearly, hierarchy.leaves, unit]);

            const chartData = useMemo(() => {
                if (unit === 'overall' || isGroup) {
                    const iterationTarget = unit === 'overall' ? hierarchy.parents.map(p => hierarchy.dict[p][0]) : hierarchy.dict[actualUnit];
                    return iterationTarget.map(iter => {
                        const children = [iter]; 
                        const dList = data.filter(item => item.year === year && (isYearly ? true : item.month === month) && children.includes(item.unit) && item.status === 'submitted');
                        const totals = aggregateTotals(dList);
                        return {
                            name: iter, elec_actual: totals.elec_act, water_actual: totals.water_act, oil_actual: totals.oil_total,
                            elec_std: totals.elec_std, water_std: totals.water_std,
                            oil_op_diesel: totals.oil_op_diesel, oil_op_benzene: totals.oil_op_benzene, oil_op_aviation: totals.oil_op_aviation,
                            oil_adm_diesel: totals.oil_adm_diesel, oil_adm_benzene: totals.oil_adm_benzene,
                        };
                    });
                } else {
                    return MONTHS.map(m => {
                        const dList = data.filter(item => item.year === year && item.unit === unit && item.month === m && item.status === 'submitted');
                        const totals = aggregateTotals(dList);
                        return {
                            name: m, elec_actual: totals.elec_act, elec_std: totals.elec_std,
                            water_actual: totals.water_act, water_std: totals.water_std, oil_actual: totals.oil_total,
                            oil_op_diesel: totals.oil_op_diesel, oil_op_benzene: totals.oil_op_benzene, oil_op_aviation: totals.oil_op_aviation,
                            oil_adm_diesel: totals.oil_adm_diesel, oil_adm_benzene: totals.oil_adm_benzene,
                        };
                    });
                }
            }, [data, unit, month, year, isGroup, actualUnit, isYearly, hierarchy]);

            const allUnitsComparisonData = useMemo(() => {
                const monthIndex = MONTHS.indexOf(month);
                let pMonth, pYear;
                if (isYearly) { pMonth = null; pYear = (parseInt(year) - 1).toString(); }
                else {
                    if (comparisonMode === 'mom') { pMonth = monthIndex === 0 ? MONTHS[11] : MONTHS[monthIndex - 1]; pYear = monthIndex === 0 ? (parseInt(year) - 1).toString() : year; }
                    else { pMonth = month; pYear = (parseInt(year) - 1).toString(); }
                }

                const targetUnits = unit === 'overall' ? hierarchy.parents.map(p => hierarchy.dict[p][0]) : displayUnits;
                return targetUnits.map(u => {
                    const children = [u]; 
                    const currTotals = aggregateTotals(data.filter(d => d.year === year && (isYearly ? true : d.month === month) && children.includes(d.unit) && d.status === 'submitted'));
                    const prevTotals = aggregateTotals(data.filter(d => d.year === pYear && (isYearly ? true : d.month === pMonth) && children.includes(d.unit) && d.status === 'submitted'));
                    return {
                        unit: u, elec_curr: currTotals.elec_act, elec_prev: prevTotals.elec_act,
                        water_curr: currTotals.water_act, water_prev: prevTotals.water_act,
                        oil_curr: currTotals.oil_total, oil_prev: prevTotals.oil_total,
                    };
                });
            }, [data, month, year, displayUnits, unit, isYearly, comparisonMode, hierarchy]);

            const secData = useMemo(() => {
                if (activeCategory !== 'sec') return { list: [], avgElec: 0, avgWater: 0 };
                const targetUnits = unit === 'overall' ? hierarchy.leaves : (isGroup ? hierarchy.dict[actualUnit] : [unit]);
                
                let totalSecElec = 0, totalSecWater = 0, validElecCount = 0, validWaterCount = 0;
                
                const list = targetUnits.map(u => {
                    const uData = data.filter(d => d.year === year && (isYearly ? true : d.month === month) && d.unit === u && d.status === 'submitted');
                    const totals = aggregateTotals(uData);
                    
                    let area = 0, staff = 0;
                    
                    if (uData.length > 0) {
                        const latest = uData[uData.length - 1];
                        area = Number(latest.extra_info?.area) || 0;
                        staff = Number(latest.extra_info?.staff) || 0;
                    }

                    if (area === 0 || staff === 0) {
                        const historyRecord = data.slice().reverse().find(d => d.unit === u && (Number(d.extra_info?.area) > 0 || Number(d.extra_info?.staff) > 0));
                        if (historyRecord) {
                            area = area || Number(historyRecord.extra_info?.area) || 0;
                            staff = staff || Number(historyRecord.extra_info?.staff) || 0;
                        }
                    }

                    const elecSec = area > 0 && totals.elec_act > 0 ? totals.elec_act / area : 0;
                    const waterSec = staff > 0 && totals.water_act > 0 ? totals.water_act / staff : 0;

                    if (elecSec > 0) { totalSecElec += elecSec; validElecCount++; }
                    if (waterSec > 0) { totalSecWater += waterSec; validWaterCount++; }

                    return { 
                        unit: u, 
                        elecSec: Number(elecSec.toFixed(2)), 
                        waterSec: Number(waterSec.toFixed(2)), 
                        area, staff, 
                        elecAct: totals.elec_act, 
                        waterAct: totals.water_act 
                    };
                }).filter(item => item.elecAct > 0 || item.waterAct > 0);

                list.sort((a, b) => a.elecSec - b.elecSec);

                return {
                    list,
                    avgElec: validElecCount > 0 ? totalSecElec / validElecCount : 0,
                    avgWater: validWaterCount > 0 ? totalSecWater / validWaterCount : 0
                };
            }, [data, activeCategory, year, month, isYearly, hierarchy, unit, isGroup, actualUnit]);

            const calcDiff = (curr, prev) => {
                if (prev === 0 && curr === 0) return { text: '-', color: 'text-slate-400' };
                if (prev === 0) return { text: '+100%', color: 'text-rose-600' };
                const diff = ((curr - prev) / prev) * 100;
                const isUp = diff > 0;
                return { 
                    text: `${isUp ? '+' : ''}${Math.abs(diff).toFixed(1)}%`, 
                    color: isUp ? 'text-rose-600 font-medium' : 'text-emerald-600 font-medium',
                    icon: isUp ? <TrendingUp className="inline w-3 h-3 mr-1" /> : <TrendingDown className="inline w-3 h-3 mr-1" />
                };
            };

            const elecDiff = stats.elec_act - stats.elec_std;
            const waterDiff = stats.water_act - stats.water_std;
            const comparisonSubtitle = isYearly ? "ปีปัจจุบัน vs ปีก่อน" : (comparisonMode === 'mom' ? "เดือนปัจจุบัน vs เดือนก่อน" : "เดือนปัจจุบัน vs เดือนเดียวกันปีก่อน");
            const comparisonPrevName = isYearly ? "ปีก่อน" : (comparisonMode === 'mom' ? "เดือนก่อน" : "ปีก่อน");

            const renderMoM = (current, previous, unitText) => {
                if (previous === 0) return <span className="text-slate-400 text-sm font-medium">ไม่มีอดีตเปรียบเทียบ</span>;
                const diff = current - previous;
                const percent = ((diff / previous) * 100).toFixed(1);
                const isUp = diff > 0;
                return (
                    <div className={`flex items-center text-sm font-bold ${isUp ? 'text-rose-600' : 'text-emerald-600'}`}>
                        {isUp ? <TrendingUp className="w-4 h-4 mr-1" /> : <TrendingDown className="w-4 h-4 mr-1" />}
                        <span>{Math.abs(diff).toLocaleString(undefined, {maximumFractionDigits:0})} {unitText} ({Math.abs(percent)}%)</span>
                    </div>
                );
            };

            const renderOilPieChart = () => {
                const totalOp = stats.oil_op_diesel + stats.oil_op_benzene + stats.oil_op_aviation;
                const totalAdm = stats.oil_adm_diesel + stats.oil_adm_benzene;
                
                if (totalOp === 0 && totalAdm === 0) {
                    return <div className="h-full flex items-center justify-center text-slate-400 text-xs font-medium">ไม่มีข้อมูลเบิกจ่ายในรอบนี้</div>;
                }

                const oilPieData = [
                    { name: 'ปฏิบัติการ (Operation)', value: totalOp, color: '#f97316' },
                    { name: 'ธุรการ (Admin)', value: totalAdm, color: '#3b82f6' }
                ].filter(d => d.value > 0);

                return (
                    <div className="w-full h-full flex flex-col justify-center items-center">
                        <div className="w-full h-[180px]">
                            <ResponsiveContainer width="100%" height="100%">
                                <PieChart>
                                    <Pie data={oilPieData} cx="50%" cy="50%" innerRadius={45} outerRadius={75} paddingAngle={2} dataKey="value" stroke="none">
                                        {oilPieData.map((entry, index) => (
                                            <Cell key={`cell-${index}`} fill={entry.color} />
                                        ))}
                                    </Pie>
                                    <Tooltip contentStyle={{fontSize: '12px', borderRadius: '12px', border: '1px solid #fde68a', backgroundColor: '#fffbeb', color: '#78350f', fontWeight: 'bold'}} formatter={(value) => `${value.toLocaleString()} ลิตร`} />
                                </PieChart>
                            </ResponsiveContainer>
                        </div>
                        <div className="flex space-x-5 mt-2 text-[11px] font-bold">
                            <span className="flex items-center text-orange-600"><span className="w-3 h-3 rounded-full bg-orange-500 mr-1.5 shadow-sm"></span>ปฏิบัติการ</span>
                            <span className="flex items-center text-blue-600"><span className="w-3 h-3 rounded-full bg-blue-500 mr-1.5 shadow-sm"></span>ธุรการ</span>
                        </div>
                    </div>
                );
            };

            const hasAnyDataInYear = useMemo(() => {
                return data.some(d => d.year === year && displayUnits.includes(d.unit) && d.status === 'submitted');
            }, [data, year, displayUnits]);

            if (!hasAnyDataInYear) {
                return (
                    <div className="flex flex-col items-center justify-center h-[70vh] text-slate-500 bg-white rounded-2xl shadow-sm border border-slate-200 p-8 animate-in fade-in duration-500">
                        <AlertCircle className="w-20 h-20 mb-5 text-slate-200" />
                        <h3 className="text-xl font-bold text-slate-700">ยังไม่มีการรายงานข้อมูลในปีงบประมาณ {year}</h3>
                        <p className="mt-2 font-medium">โปรดรอส่วนราชการบันทึกรายงาน หรือเปลี่ยนไปดูข้อมูลของปีอื่น</p>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto space-y-6 animate-in fade-in duration-500">
                    {currentData.length === 0 && !isYearly && (
                        <div className="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-xl flex items-center shadow-sm animate-in fade-in slide-in-from-top-2">
                            <AlertTriangle className="w-5 h-5 mr-3 flex-shrink-0" />
                            <div className="text-sm">
                                <span className="font-bold">ไม่มีข้อมูลรายงาน:</span> ไม่พบข้อมูลของ <span className="font-bold">{unit === 'overall' ? 'ทุกหน่วยงาน' : unit}</span> ในเดือน <span className="font-bold">{month} {year}</span> (แดชบอร์ดเดือนนี้จะแสดงผลเป็น 0) แต่คุณยังสามารถดูกราฟแนวโน้มจากเดือนอื่นๆ ได้
                            </div>
                        </div>
                    )}
                    <div className="flex flex-col md:flex-row justify-between items-center bg-white px-5 py-3.5 rounded-xl shadow-sm border border-slate-200 mb-6 no-print gap-4">
                        <div className="flex items-center space-x-4">
                            <span className="text-[13px] font-bold text-slate-500 uppercase tracking-wider">โหมดวิเคราะห์อดีต:</span>
                            {!isYearly ? (
                                <div className="flex bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <button onClick={() => setComparisonMode('mom')} className={`px-4 py-1.5 text-xs rounded-md transition-all ${comparisonMode === 'mom' ? 'bg-white shadow-sm font-bold text-emerald-700 border border-slate-200/50' : 'text-slate-500 hover:text-slate-800 font-medium'}`}>เทียบเดือนก่อน (MoM)</button>
                                    <button onClick={() => setComparisonMode('yoy')} className={`px-4 py-1.5 text-xs rounded-md transition-all ${comparisonMode === 'yoy' ? 'bg-white shadow-sm font-bold text-emerald-700 border border-slate-200/50' : 'text-slate-500 hover:text-slate-800 font-medium'}`}>เทียบปีก่อน (YoY)</button>
                                </div>
                            ) : (<span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 px-4 py-1.5 rounded-lg">วิเคราะห์เทียบปีก่อนหน้า (YoY)</span>)}
                        </div>
                        <div className="flex items-center space-x-4">
                            <span className="text-[13px] font-bold text-slate-500 uppercase tracking-wider">รูปแบบการแสดงผล:</span>
                            <div className="flex bg-slate-100 rounded-lg p-1 border border-slate-200">
                                <button onClick={() => setViewMode('chart')} className={`px-4 py-1.5 text-xs rounded-md transition-all flex items-center ${viewMode === 'chart' ? 'bg-white shadow-sm font-bold text-emerald-700 border border-slate-200/50' : 'text-slate-500 hover:text-slate-800 font-medium'}`}>📊 กราฟแท่ง</button>
                                <button onClick={() => setViewMode('table')} className={`px-4 py-1.5 text-xs rounded-md transition-all flex items-center ${viewMode === 'table' ? 'bg-white shadow-sm font-bold text-emerald-700 border border-slate-200/50' : 'text-slate-500 hover:text-slate-800 font-medium'}`}>📝 ตารางข้อมูล</button>
                            </div>
                        </div>
                    </div>

                    {activeCategory === 'sec' && (
                        <div className="space-y-6 animate-in fade-in duration-500">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex items-center justify-between mb-6">
                                    <div className="flex items-center">
                                        <div className="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center mr-4 border border-purple-100 shadow-inner"><Gauge className="w-6 h-6 text-purple-600" /></div>
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-800 leading-tight">ดัชนีการใช้พลังงานจำเพาะ (SEC)</h3>
                                            <p className="text-sm font-medium text-slate-500 mt-1">Specific Energy Consumption: ตัวชี้วัดประสิทธิภาพเทียบกับการใช้งานจริง</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                                    <div className="bg-purple-50 border border-purple-100 p-5 rounded-xl shadow-sm relative overflow-hidden group">
                                        <div className="absolute right-0 bottom-0 opacity-[0.05] group-hover:opacity-10 pointer-events-none transform translate-x-1/4 translate-y-1/4 transition-all duration-500"><Zap className="w-32 h-32 text-purple-900"/></div>
                                        <h4 className="text-sm font-bold text-purple-800 mb-2">ดัชนีไฟฟ้าเฉลี่ย (ต่อพื้นที่)</h4>
                                        <div className="flex items-baseline space-x-2">
                                            <span className="text-4xl font-black text-purple-900">{secData.avgElec.toFixed(2)}</span>
                                            <span className="text-sm font-bold text-purple-700">kWh / ตร.ม.</span>
                                        </div>
                                        <p className="text-xs font-medium text-purple-600 mt-2">ค่าเฉลี่ยของหน่วยงานที่ประเมินในรอบนี้</p>
                                    </div>
                                    <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-xl shadow-sm relative overflow-hidden group">
                                        <div className="absolute right-0 bottom-0 opacity-[0.05] group-hover:opacity-10 pointer-events-none transform translate-x-1/4 translate-y-1/4 transition-all duration-500"><Droplets className="w-32 h-32 text-indigo-900"/></div>
                                        <h4 className="text-sm font-bold text-indigo-800 mb-2">ดัชนีน้ำประปาเฉลี่ย (ต่อคน)</h4>
                                        <div className="flex items-baseline space-x-2">
                                            <span className="text-4xl font-black text-indigo-900">{secData.avgWater.toFixed(2)}</span>
                                            <span className="text-sm font-bold text-indigo-700">ลบ.ม. / คน</span>
                                        </div>
                                        <p className="text-xs font-medium text-indigo-600 mt-2">ค่าเฉลี่ยของหน่วยงานที่ประเมินในรอบนี้</p>
                                    </div>
                                </div>

                                {secData.list.length > 0 ? (
                                    <>
                                    <h4 className="font-bold text-slate-800 mb-4 flex items-center text-lg"><span className="w-2 h-6 bg-purple-600 rounded-full mr-3"></span>จัดอันดับหน่วยงานที่มีประสิทธิภาพไฟฟ้าสูงสุด (น้อยคือดี)</h4>
                                    <div className="h-[400px] bg-slate-50/50 rounded-xl p-4 border border-slate-100 mb-8">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={secData.list} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#e2e8f0" />
                                                <XAxis type="number" tick={{fontSize: 11, fill: '#64748b'}} axisLine={false} tickLine={false} />
                                                <YAxis dataKey="unit" type="category" tick={{fontSize: 11, fill: '#64748b', fontWeight: 600}} width={120} axisLine={false} tickLine={false} />
                                                <Tooltip cursor={{fill: '#f1f5f9'}} contentStyle={{fontSize: '13px', borderRadius: '12px', border: '1px solid #e2e8f0'}} formatter={(value) => [`${value} kWh/ตร.ม.`, 'ค่า SEC']} />
                                                <Bar dataKey="elecSec" fill="#8b5cf6" radius={[0, 4, 4, 0]} barSize={20} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                    </>
                                ) : (
                                    <div className="text-center p-8 bg-slate-50 rounded-xl border border-slate-200">
                                        <AlertCircle className="w-12 h-12 text-slate-400 mx-auto mb-3" />
                                        <p className="text-slate-600 font-medium">ไม่พบข้อมูลประกอบการประเมิน (จำนวนคน/พื้นที่) ในช่วงเวลานี้</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {(activeCategory === 'all' && (currentUser.role === 'admin' || currentUser.role === 'executive') && unit === 'overall') && (
                        <>
                        <div className="bg-[#064e3b] rounded-2xl shadow-lg border border-[#065f46] overflow-hidden mb-6 no-print text-white relative">
                            <div className="absolute top-0 right-0 p-8 opacity-10 pointer-events-none"><Globe className="w-48 h-48 text-emerald-200" /></div>
                            <div className="px-6 py-4 border-b border-[#065f46]/50 flex justify-between items-center bg-black/20 relative z-10">
                                <h3 className="text-lg font-bold flex items-center text-emerald-300">
                                    <Leaf className="w-5 h-5 mr-2" /> รายงาน ESG & คาร์บอนฟุตพริ้นท์ (GHG Protocol)
                                </h3>
                                <span className="text-[10px] uppercase bg-emerald-500/30 border border-emerald-400 px-3 py-1 rounded-full text-emerald-100 font-bold tracking-widest">มาตรฐาน ISO 14064-1</span>
                            </div>
                            
                            <div className="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10">
                                <div className="bg-black/20 rounded-xl p-5 border border-white/10 backdrop-blur-md col-span-1 lg:col-span-2">
                                    <h4 className="font-bold text-slate-200 mb-5 flex items-center border-b border-white/10 pb-3">
                                        สรุปการปล่อยก๊าซเรือนกระจกรวม (YTD)
                                    </h4>

                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="mt-10 pt-8 border-t border-slate-100 no-print">
                                <h4 className="font-bold text-slate-800 mb-6 flex items-center text-lg"><span className="w-2 h-6 bg-orange-400 rounded-full mr-3"></span>{(unit === 'overall' || isGroup) ? 'ปริมาณการใช้น้ำมันแต่ละหน่วยงาน' : 'แนวโน้มการใช้น้ำมันรายเดือนตลอดปี'}</h4>
                                {viewMode === 'chart' ? (
                                    <div className="h-[340px] bg-slate-50/50 rounded-xl p-4 border border-slate-100">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: (unit === 'overall' || isGroup) ? 20 : 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                <XAxis dataKey="name" {...((unit === 'overall' || isGroup) ? {interval: 0, angle: -30, textAnchor: "end"} : {})} tick={{fontSize: 11, fill: '#64748b', fontWeight: 600}} axisLine={false} tickLine={false} />
                                                <YAxis tick={{fontSize: 11, fill: '#64748b', fontWeight: 600}} axisLine={false} tickLine={false} />
                                                <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{fontSize: '13px', borderRadius: '12px', border: '1px solid #e2e8f0', boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)'}} />
                                                <Legend iconType="circle" wrapperStyle={{fontWeight: 600, paddingTop: (unit === 'overall' || isGroup) ? '20px' : '10px'}} />
                                                <Bar dataKey="oil_actual" name="ปริมาณใช้จริง (ลิตร)" fill="#f97316" radius={[4, 4, 0, 0]} maxBarSize={50} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                                        <table className="w-full text-sm text-left">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                                                    <th className="p-4 font-bold">{!(unit === 'overall' || isGroup) ? 'เดือนประเมิน' : 'รายชื่อหน่วยงาน'}</th>
                                                    <th className="p-4 text-right font-bold">ใช้จริง (ลิตร)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {chartData.map(row => {
                                                    const actual = row.oil_actual || 0;
                                                    if(actual === 0) return null;
                                                    return (
                                                        <tr key={row.name} className="hover:bg-orange-50/50 transition-colors">
                                                            <td className="p-4 font-bold text-slate-700">{row.name}</td>
                                                            <td className="p-4 text-right font-bold text-base text-orange-600">
                                                                {actual.toLocaleString(undefined, {maximumFractionDigits:0})}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </section>
                    )}
                </div>
            );
        }

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================
        function App() {
            // Core States
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [globalMonth, setGlobalMonth] = useState('ม.ค.');
            const [selectedYear, setSelectedYear] = useState('2567');
            const [selectedDashboardUnit, setSelectedDashboardUnit] = useState('overall');
            const [activeCategory, setActiveCategory] = useState('all');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            
            // Data States
            const [data, setData] = useState([]);
            const [logs, setLogs] = useState([]);
            const [hierarchy, setHierarchy] = useState({
                dict: DEFAULT_HIERARCHY,
                parents: Object.keys(DEFAULT_HIERARCHY),
                leaves: Object.values(DEFAULT_HIERARCHY).flat()
            });
            const [announcement, setAnnouncement] = useState('');
            const [adminPasswords, setAdminPasswords] = useState({});
            const [execPasswords, setExecPasswords] = useState({});
            const [passwords, setPasswords] = useState({});
            
            const [isLoading, setIsLoading] = useState(true);
            const [modalState, setModalState] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null });

            const showModal = (options) => {
                setModalState({ isOpen: true, ...options });
            };
            const closeModal = () => setModalState({ isOpen: false });

            // Auto-Logout
            useEffect(() => {
                if (!currentUser) return;
                let timeoutId;
                const resetTimer = () => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => {
                        handleLogout();
                        showModal({title: 'หมดเวลาเชื่อมต่อ', message: 'ระบบได้นำคุณออกจากระบบอัตโนมัติเนื่องจากไม่มีการใช้งานเกิน 30 นาที เพื่อความปลอดภัย', type: 'alert'});
                    }, 30 * 60 * 1000); // 30 minutes
                };
                
                const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
                events.forEach(e => document.addEventListener(e, resetTimer));
                resetTimer();
                
                return () => {
                    clearTimeout(timeoutId);
                    events.forEach(e => document.removeEventListener(e, resetTimer));
                };
            }, [currentUser]);

            const initDefaultPasswords = async () => {
                const storedAdmins = localStorage.getItem('energy_admins');
                const storedExecs = localStorage.getItem('energy_execs');
                const storedUnits = localStorage.getItem('energy_units');
                
                if (storedAdmins) setAdminPasswords(JSON.parse(storedAdmins));
                else {
                    const defaultAdmin = await hashPassword('admin');
                    setAdminPasswords({ 'admin': defaultAdmin });
                }
                
                if (storedExecs) setExecPasswords(JSON.parse(storedExecs));
                else {
                    const defaultExec = await hashPassword('boss');
                    setExecPasswords({ 'boss': defaultExec });
                }
                
                if (storedUnits) setPasswords(JSON.parse(storedUnits));
                else {
                    const defaultUser = await hashPassword('1234');
                    const initialUnits = {};
                    hierarchy.leaves.forEach(u => initialUnits[u] = defaultUser);
                    setPasswords(initialUnits);
                }
            };

            useEffect(() => {
                // Initialize Settings
                initDefaultPasswords();
                
                const loadDatabase = async () => {
                    // 1. โหลดข้อมูลจากเครื่องก่อน (เพื่อให้แสดงผลทันทีระหว่างรอเน็ต)
                    const storedData = localStorage.getItem('energy_data');
                    if (storedData) {
                        setData(JSON.parse(storedData));
                    } else {
                        setData([]); // เอาโค้ดที่สร้างข้อมูลจำลอง (Mock Data) ออกทั้งหมด ให้เริ่มจากฐานข้อมูลว่าง
                    }

                    // 2. ทำการซิงก์ข้อมูลจาก Google Sheets มาแสดง (ทำหน้าที่เป็น Database 100%)
                    if (typeof GOOGLE_SHEETS_URL !== 'undefined' && GOOGLE_SHEETS_URL && GOOGLE_SHEETS_URL.trim() !== '') {
                        try {
                            const fetchDataJSONP = () => new Promise((resolve, reject) => {
                                const cbName = 'jsonpCb_' + Date.now();
                                const script = document.createElement('script');
                                const timeoutId = setTimeout(() => {
                                    if (window[cbName]) { delete window[cbName]; if (script.parentNode) document.body.removeChild(script); reject(new Error('timeout')); }
                                }, 15000);
                                window[cbName] = (d) => {
                                    clearTimeout(timeoutId); delete window[cbName];
                                    if (script.parentNode) document.body.removeChild(script);
                                    resolve(d);
                                };
                                script.onerror = () => { clearTimeout(timeoutId); if (window[cbName]) delete window[cbName]; if (script.parentNode) document.body.removeChild(script); reject(new Error('load error')); };
                                script.src = GOOGLE_SHEETS_URL + '?callback=' + cbName;
                                document.body.appendChild(script);
                            });
                            const sheetData = await fetchDataJSONP();
                            if (Array.isArray(sheetData)) {
                                setData(sheetData); 
                                localStorage.setItem('energy_data', JSON.stringify(sheetData)); 
                            }
                        } catch (error) {
                            console.log("กำลังรอการเชื่อมต่อฐานข้อมูล Google Sheets...", error);
                        }
                    }
                };

                loadDatabase();
                
                const storedLogs = localStorage.getItem('energy_logs');
                if (storedLogs) setLogs(JSON.parse(storedLogs));
                
                const storedHierarchy = localStorage.getItem('energy_hierarchy');
                if (storedHierarchy) {
                    const hDict = JSON.parse(storedHierarchy);
                    setHierarchy({
                        dict: hDict,
                        parents: Object.keys(hDict),
                        leaves: Object.values(hDict).flat()
                    });
                }
                
                const storedAnnounce = localStorage.getItem('energy_announcement');
                if (storedAnnounce) setAnnouncement(storedAnnounce);

                // Simulate network delay
                setTimeout(() => setIsLoading(false), 800);
            }, []);

            const addLog = (action, details) => {
                const newLog = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('th-TH'),
                    user: currentUser ? currentUser.unit : 'System',
                    role: currentUser ? currentUser.role : 'System',
                    action,
                    details
                };
                const updatedLogs = [newLog, ...logs];
                setLogs(updatedLogs);
                localStorage.setItem('energy_logs', JSON.stringify(updatedLogs));
            };

            const handleLogin = async (role, username, password) => {
                const hashed = await hashPassword(password);
                let isValid = false;
                
                if (role === 'admin' && adminPasswords[username] === hashed) isValid = true;
                if (role === 'executive' && execPasswords[username] === hashed) isValid = true;
                if (role === 'user' && passwords[username] === hashed) isValid = true;

                if (isValid) {
                    setCurrentUser({ role, unit: username });
                    if (role === 'user') setSelectedDashboardUnit(username);
                    else setSelectedDashboardUnit('overall');
                    addLog('เข้าสู่ระบบ', `ลงชื่อเข้าใช้สำเร็จ`);
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                addLog('ออกจากระบบ', `ออกจากระบบ`);
                setCurrentUser(null);
            };

            // 🌟 นำ URL ที่ได้จากการ Deploy Google Apps Script มาวางในเครื่องหมายคำพูดด้านล่างนี้
            const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbyK0TX1GGB8ronBcpaAIU1vJYNhlSWqiiRYAF7rNZdFpu68-5gnCFT0VFZ56vNlIjKq/exec"; 

            const handleSaveData = async (payload) => {
                const newRecord = { ...payload, status: 'submitted', timestamp: new Date().toISOString() };
                
                // 1. ยิงข้อมูลไปเก็บบน Google Sheets (ปรับปรุงวิธีหลบ CORS ด้วยการใช้ fetch แบบมี no-cors ควบคู่กับการส่งเป็น Text)
                if (typeof GOOGLE_SHEETS_URL !== 'undefined' && GOOGLE_SHEETS_URL && GOOGLE_SHEETS_URL.trim() !== '' && GOOGLE_SHEETS_URL !== "วาง URL ของ Web App ตรงนี้") {
                    try {
                        // การส่งข้อมูลแบบ JSON ไปยัง Google Apps Script (Web App) มักจะเจอปัญหา CORS preflight
                        // วิธีแก้คือต้องส่งด้วย mode: 'no-cors' ซึ่งจะส่งข้อมูลไปได้ แต่จะไม่ได้รับ response กลับมา
                        fetch(GOOGLE_SHEETS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(newRecord)
                        }).then(() => {
                           console.log("ส่งคำสั่งไปยัง Google Sheets แล้ว (ไม่สามารถยืนยันสถานะตอบกลับได้เนื่องจาก no-cors)");
                        }).catch(error => {
                           console.error("Fetch API Error:", error);
                        });

                    } catch (error) {
                        console.error("Google Sheets Submission Error:", error);
                    }
                }

                // 2. บันทึกลง Local Storage (เพื่อให้ Dashboard ในเว็บแสดงผลและวาดกราฟได้ทันที)
                const filteredData = data.filter(d => !(d.unit === payload.unit && d.month === payload.month && d.year === payload.year));
                const newData = [...filteredData, newRecord];
                setData(newData);
                localStorage.setItem('energy_data', JSON.stringify(newData));
            };

            const handleUpdateHierarchy = (newDict) => {
                const newHierarchy = {
                    dict: newDict,
                    parents: Object.keys(newDict),
                    leaves: Object.values(newDict).flat()
                };
                setHierarchy(newHierarchy);
                localStorage.setItem('energy_hierarchy', JSON.stringify(newDict));
                
                // Update passwords for new units (default '1234')
                const updatedPasswords = { ...passwords };
                let needPwdUpdate = false;
                hashPassword('1234').then(defaultPwd => {
                    newHierarchy.leaves.forEach(u => {
                        if (!updatedPasswords[u]) {
                            updatedPasswords[u] = defaultPwd;
                            needPwdUpdate = true;
                        }
                    });
                    if (needPwdUpdate) {
                        setPasswords(updatedPasswords);
                        localStorage.setItem('energy_units', JSON.stringify(updatedPasswords));
                    }
                });
            };

            const handleUpdateStandards = async (year, newStandards) => {
                const newData = data.map(d => {
                    if (d.year === year && newStandards[d.unit]) {
                        return {
                            ...d,
                            electricity: { ...d.electricity, standard: newStandards[d.unit].elec },
                            water: { ...d.water, standard: newStandards[d.unit].water }
                        };
                    }
                    return d;
                });
                setData(newData);
                localStorage.setItem('energy_data', JSON.stringify(newData));
                showModal({ title: 'สำเร็จ', message: 'บันทึกค่าอ้างอิงเรียบร้อยแล้ว', type: 'alert' });
            };

            const handleUpdateAccess = (type, value, typeName) => {
                if (type === 'adminPasswords') { setAdminPasswords(value); localStorage.setItem('energy_admins', JSON.stringify(value)); }
                if (type === 'execPasswords') { setExecPasswords(value); localStorage.setItem('energy_execs', JSON.stringify(value)); }
                if (type === 'passwords') { setPasswords(value); localStorage.setItem('energy_units', JSON.stringify(value)); }
                if (type === 'announcement') { setAnnouncement(value); localStorage.setItem('energy_announcement', value); }
                addLog('ตั้งค่าระบบ', `อัปเดตข้อมูล ${typeName}`);
                showModal({ title: 'สำเร็จ', message: `บันทึกข้อมูล ${typeName} เรียบร้อยแล้ว`, type: 'alert' });
            };

            const handleRestore = (parsedBackup) => {
                localStorage.setItem('energy_data', JSON.stringify(parsedBackup.data));
                if (parsedBackup.logs) localStorage.setItem('energy_logs', JSON.stringify(parsedBackup.logs));
                if (parsedBackup.hierarchy && parsedBackup.hierarchy.dict) localStorage.setItem('energy_hierarchy', JSON.stringify(parsedBackup.hierarchy.dict));
                if (parsedBackup.admins) localStorage.setItem('energy_admins', parsedBackup.admins);
                if (parsedBackup.execs) localStorage.setItem('energy_execs', parsedBackup.execs);
                if (parsedBackup.units) localStorage.setItem('energy_units', parsedBackup.units);
                if (parsedBackup.announcement !== undefined) localStorage.setItem('energy_announcement', parsedBackup.announcement);
            };

            if (isLoading) {
                return <div className="flex h-screen items-center justify-center bg-slate-50"><SmallLoader className="w-10 h-10 text-emerald-500" /></div>;
            }

            if (!currentUser) {
                return <LoginScreen onLogin={handleLogin} hierarchy={hierarchy} globalAnnouncement={announcement} />;
            }

            return (
                <div className="flex h-screen bg-[#f8fafc] overflow-hidden font-sans">
                    <Modal {...modalState} onClose={closeModal} />
                    
                    {/* Mobile Sidebar Overlay */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/50 z-20 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsSidebarOpen(false)}></div>}
                    
                    {/* Sidebar */}
                    <aside className={`w-64 bg-[#1e293b] text-slate-300 flex flex-col shadow-xl z-30 fixed md:relative h-full transition-transform transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} no-print flex-shrink-0`}>
                        <div className="p-6 border-b border-slate-700/50 flex justify-between items-center">
                            <div>
                                <div className="flex items-center mb-1">
                                    <Leaf className="w-6 h-6 text-emerald-400 mr-2" />
                                    <h1 className="text-white font-bold text-lg tracking-tight">RTARF Energy</h1>
                                </div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Enterprise Edition</p>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-white p-2"><XCircle className="w-5 h-5"/></button>
                        </div>
                        
                        <div className="p-4">
                            <div className="bg-slate-800 rounded-xl p-3 border border-slate-700">
                                <div className="flex items-center text-emerald-400 mb-1">
                                    <UserIcon className="w-4 h-4 mr-2" />
                                    <span className="font-bold text-sm truncate">{currentUser.unit}</span>
                                </div>
                                <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-bold uppercase tracking-wider">{currentUser.role}</span>
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto py-2 custom-scrollbar">
                            <ul className="space-y-1 px-3">
                                <li><button onClick={() => {setActiveTab('dashboard'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><LayoutDashboard className="w-4 h-4 mr-3"/> แดชบอร์ดวิเคราะห์ผล</button></li>
                                {currentUser.role === 'user' || currentUser.role === 'admin' ? (
                                    <li><button onClick={() => {setActiveTab('entry'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'entry' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><FileEdit className="w-4 h-4 mr-3"/> บันทึกข้อมูลรายงาน</button></li>
                                ) : null}
                                
                                {currentUser.role !== 'user' && (
                                    <>
                                        <li className="pt-4 pb-2 px-3"><span className="text-xs font-bold text-slate-500 uppercase tracking-wider">สำหรับผู้บริหาร & ส่วนกลาง</span></li>
                                        <li><button onClick={() => {setActiveTab('status'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'status' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><ClipboardList className="w-4 h-4 mr-3"/> ติดตามสถานะการส่ง</button></li>
                                        <li><button onClick={() => {setActiveTab('export'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'export' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><Download className="w-4 h-4 mr-3"/> สรุปผล / Export</button></li>
                                    </>
                                )}
                                
                                {currentUser.role === 'admin' && (
                                    <>
                                        <li className="pt-4 pb-2 px-3"><span className="text-xs font-bold text-slate-500 uppercase tracking-wider">การตั้งค่าระบบ</span></li>
                                        <li><button onClick={() => {setActiveTab('settings_unit'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'settings_unit' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><Network className="w-4 h-4 mr-3"/> โครงสร้างหน่วยงาน</button></li>
                                        <li><button onClick={() => {setActiveTab('settings_std'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'settings_std' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><Target className="w-4 h-4 mr-3"/> ตั้งค่าเป้าหมายลดใช้พลังงาน</button></li>
                                        <li><button onClick={() => {setActiveTab('settings_access'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'settings_access' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><Lock className="w-4 h-4 mr-3"/> จัดการรหัสผ่าน & สิทธิ์</button></li>
                                        <li><button onClick={() => {setActiveTab('settings_backup'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'settings_backup' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><Database className="w-4 h-4 mr-3"/> สำรอง/กู้คืนข้อมูล</button></li>
                                        <li><button onClick={() => {setActiveTab('audit'); setIsSidebarOpen(false);}} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'audit' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800 hover:text-white'}`}><HistoryIcon className="w-4 h-4 mr-3"/> ประวัติการใช้งาน (Logs)</button></li>
                                    </>
                                )}
                            </ul>
                        </nav>

                        <div className="p-4 border-t border-slate-700/50">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center px-4 py-2.5 bg-rose-500/10 text-rose-400 rounded-lg hover:bg-rose-500 hover:text-white transition-colors text-sm font-bold">
                                <LogOut className="w-4 h-4 mr-2" /> ออกจากระบบ
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        {announcement && (
                            <div className="bg-emerald-600 text-white text-xs py-1.5 px-4 flex justify-center items-center shadow-md z-10 w-full no-print">
                                <Megaphone className="w-3.5 h-3.5 mr-2 inline flex-shrink-0" /> <span className="truncate">{announcement}</span>
                            </div>
                        )}
                        
                        {/* Global Header */}
                        <header className="bg-white border-b border-slate-200 px-4 md:px-6 py-4 flex flex-col md:flex-row md:items-center justify-between shadow-sm z-10 no-print flex-shrink-0">
                            <div className="flex items-center mb-4 md:mb-0">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden mr-3 p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-colors">
                                    <Menu className="w-5 h-5" />
                                </button>
                                <h2 className="text-xl font-bold text-slate-800">
                                    {activeTab === 'dashboard' && 'แดชบอร์ดสรุปผลและวิเคราะห์'}
                                    {activeTab === 'entry' && 'บันทึกข้อมูลการใช้พลังงาน'}
                                    {activeTab === 'status' && 'สถานะการส่งรายงาน'}
                                    {activeTab === 'export' && 'รายงานและการส่งออกข้อมูล'}
                                    {activeTab === 'settings_unit' && 'ตั้งค่าโครงสร้างหน่วยงาน'}
                                    {activeTab === 'settings_std' && 'ตั้งค่าเป้าหมายลดใช้พลังงาน'}
                                    {activeTab === 'settings_access' && 'จัดการรหัสผ่านและสิทธิ์'}
                                    {activeTab === 'settings_backup' && 'สำรองและกู้คืนฐานข้อมูล'}
                                    {activeTab === 'audit' && 'ประวัติการเข้าใช้งาน'}
                                </h2>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2 md:gap-3">
                                {activeTab === 'dashboard' && (
                                    <div className="bg-slate-100 rounded-lg p-1 border border-slate-200 flex text-sm mr-0 md:mr-2 overflow-x-auto w-full md:w-auto">
                                        <button onClick={() => setActiveCategory('all')} className={`px-3 py-1.5 rounded-md font-bold transition-all whitespace-nowrap ${activeCategory === 'all' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>ภาพรวม</button>
                                        <button onClick={() => setActiveCategory('elec')} className={`px-3 py-1.5 rounded-md font-bold transition-all whitespace-nowrap ${activeCategory === 'elec' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-500 hover:text-emerald-600'}`}>ไฟฟ้า</button>
                                        <button onClick={() => setActiveCategory('water')} className={`px-3 py-1.5 rounded-md font-bold transition-all whitespace-nowrap ${activeCategory === 'water' ? 'bg-white shadow-sm text-cyan-600' : 'text-slate-500 hover:text-cyan-600'}`}>ประปา</button>
                                        <button onClick={() => setActiveCategory('oil')} className={`px-3 py-1.5 rounded-md font-bold transition-all whitespace-nowrap ${activeCategory === 'oil' ? 'bg-white shadow-sm text-orange-600' : 'text-slate-500 hover:text-orange-600'}`}>น้ำมัน</button>
                                        {(currentUser.role === 'admin' || currentUser.role === 'executive') && (
                                            <button onClick={() => setActiveCategory('sec')} className={`px-3 py-1.5 rounded-md font-bold transition-all whitespace-nowrap ${activeCategory === 'sec' ? 'bg-white shadow-sm text-purple-600' : 'text-slate-500 hover:text-purple-600'}`}>SEC</button>
                                        )}
                                    </div>
                                )}

                                {activeTab === 'dashboard' && currentUser.role !== 'user' && (
                                    <select value={selectedDashboardUnit} onChange={(e) => setSelectedDashboardUnit(e.target.value)} className="border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none bg-white shadow-sm">
                                        <option value="overall">กองบัญชาการกองทัพไทย (ทั้งหมด)</option>
                                        <optgroup label="กลุ่มหน่วยงานหลัก">
                                            {hierarchy.parents.map(p => <option key={`group_${p}`} value={`GROUP_${p}`}>{p} (รวมทุกหน่วยย่อย)</option>)}
                                        </optgroup>
                                        <optgroup label="หน่วยงานย่อยเฉพาะ">
                                            {hierarchy.leaves.map(u => <option key={u} value={u}>{u}</option>)}
                                        </optgroup>
                                    </select>
                                )}
                                
                                <select value={globalMonth} onChange={(e) => setGlobalMonth(e.target.value)} className="border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none bg-white shadow-sm">
                                    {activeTab === 'dashboard' || activeTab === 'export' ? <option value="สรุปรายปี">📊 สรุปรายปี (YTD)</option> : null}
                                    {MONTHS.map(m => <option key={m} value={m}>เดือน {m}</option>)}
                                </select>
                                
                                <select value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)} className="border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none bg-white shadow-sm">
                                    {YEARS.map(y => <option key={y} value={y}>ปีงบฯ {y}</option>)}
                                </select>

                                {(activeTab === 'dashboard' || activeTab === 'export') && (
                                    <button onClick={() => window.print()} className="bg-slate-800 text-white p-2 rounded-xl hover:bg-black transition-colors shadow-sm ml-1" title="พิมพ์รายงาน">
                                        <Printer className="w-5 h-5" />
                                    </button>
                                )}
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar print:p-0 print:overflow-visible">
                            {activeTab === 'dashboard' && <Dashboard unit={selectedDashboardUnit} month={globalMonth} year={selectedYear} data={data} activeCategory={activeCategory} hierarchy={hierarchy} currentUser={currentUser} />}
                            {activeTab === 'entry' && <DataEntryForm data={data} onSave={handleSaveData} currentUser={currentUser} globalMonth={globalMonth} selectedYear={selectedYear} hierarchy={hierarchy} onAddLog={addLog} showModal={showModal} />}
                            {activeTab === 'status' && <StatusTracking data={data} month={globalMonth === 'สรุปรายปี' ? MONTHS[new Date().getMonth()] : globalMonth} year={selectedYear} hierarchy={hierarchy} />}
                            {activeTab === 'export' && <ReportExport data={data} month={globalMonth} year={selectedYear} hierarchy={hierarchy} currentUser={currentUser} />}
                            {activeTab === 'settings_unit' && <UnitSettings hierarchy={hierarchy} onUpdateHierarchy={handleUpdateHierarchy} onAddLog={addLog} showModal={showModal} />}
                            {activeTab === 'settings_std' && <StandardSettings data={data} year={selectedYear} onUpdateStandards={handleUpdateStandards} hierarchy={hierarchy} onAddLog={addLog} showModal={showModal} />}
                            {activeTab === 'settings_access' && <AccessSettings adminPasswords={adminPasswords} execPasswords={execPasswords} unitPasswords={passwords} hierarchy={hierarchy} globalAnnouncement={announcement} onUpdateAccess={handleUpdateAccess} showModal={showModal} currentUser={currentUser} />}
                            {activeTab === 'settings_backup' && <BackupSettings data={data} logs={logs} hierarchy={hierarchy} showModal={showModal} onRestore={handleRestore} />}
                            {activeTab === 'audit' && <AuditLogs logs={logs} />}
                        </main>
                    </div>
                </div>
            );
        }

        // ==========================================
        // RENDER APPLICATION WITH ERROR BOUNDARY
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
