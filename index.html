    <style>

        /* Custom Scrollbar */

            .no-print { display: none !important; }

            .overflow-hidden, .overflow-auto, .overflow-x-auto, .overflow-y-auto { overflow: visible !important; }

    <script type="text/babel">
        const { useState, useMemo, useEffect, Fragment, Component } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ComposedChart, Line, Cell, PieChart, Pie, AreaChart, Area } = window.Recharts;

        // 🌟 ระบบดักจับ Error ป้องกันหน้าจอขาว (Error Boundary)
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ error: error, errorInfo: errorInfo });
                console.error("ระบบตรวจพบข้อผิดพลาด:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex items-center justify-center h-screen bg-rose-50 p-6">
                            <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8 border border-rose-200">
                                <div className="flex items-center mb-4">
                                    <svg className="w-8 h-8 text-rose-500 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                    <h2 className="text-2xl font-bold text-slate-800">ระบบขัดข้องชั่วคราว (System Error)</h2>
                                </div>
                                <p className="text-slate-600 mb-4">ขออภัยครับ พบข้อผิดพลาดในการประมวลผลโค้ดบางส่วน ทำให้ไม่สามารถแสดงหน้าเว็บได้ กรุณาตรวจสอบรายละเอียด Error ด้านล่างนี้:</p>
                                <div className="bg-rose-100 text-rose-800 p-4 rounded-lg overflow-x-auto text-sm font-mono whitespace-pre-wrap border border-rose-200">
                                    <strong>{this.state.error && this.state.error.toString()}</strong>
                                    <br/><br/>
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </div>
                                <button onClick={() => window.location.reload()} className="mt-6 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-6 rounded-lg transition-colors">รีเฟรชหน้าเว็บใหม่</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Security
        const hashPassword = async (password) => {
            if (window.sha256) return window.sha256(password);
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const EF_BENZENE = 2.2318; 
        const EF_AVIATION = 2.5; 

        const getOilTotal = (oil) => {
            if (!oil) return 0;
            return (Number(oil.operational?.diesel) || 0) + (Number(oil.operational?.benzene) || 0) + (Number(oil.operational?.aviation) || 0) + (Number(oil.administrative?.diesel) || 0) + (Number(oil.administrative?.benzene) || 0);
        };

        const aggregateTotals = (filteredData) => {
            return filteredData.reduce((acc, d) => {
                acc.elec_std += Number(d.electricity?.standard) || 0;
                acc.elec_act += Number(d.electricity?.actual) || 0;
                acc.elec_cost += Number(d.electricity?.cost) || 0;
                acc.water_std += Number(d.water?.standard) || 0;
                acc.water_act += Number(d.water?.actual) || 0;
                acc.water_cost += Number(d.water?.cost) || 0;
                
                const dsl = (Number(d.oil?.operational?.diesel) || 0) + (Number(d.oil?.administrative?.diesel) || 0);
                const bzn = (Number(d.oil?.operational?.benzene) || 0) + (Number(d.oil?.administrative?.benzene) || 0);
                const avt = (Number(d.oil?.operational?.aviation) || 0);
                
                acc.oil_op_diesel += Number(d.oil?.operational?.diesel) || 0;
                acc.oil_op_benzene += Number(d.oil?.operational?.benzene) || 0;
                acc.oil_op_aviation += avt;
                acc.oil_adm_diesel += Number(d.oil?.administrative?.diesel) || 0;
                acc.oil_adm_benzene += Number(d.oil?.administrative?.benzene) || 0;
                acc.oil_total += getOilTotal(d.oil);

                acc.carbon_scope1 += ((dsl * EF_DIESEL) + (bzn * EF_BENZENE) + (avt * EF_AVIATION)) / 1000;
                acc.carbon_scope2 += (Number(d.electricity?.actual) || 0) * EF_ELEC / 1000;
                acc.carbon_total = acc.carbon_scope1 + acc.carbon_scope2;

                return acc;
            }, {
                elec_std: 0, elec_act: 0, elec_cost: 0, water_std: 0, water_act: 0, water_cost: 0,
                oil_op_diesel: 0, oil_op_benzene: 0, oil_op_aviation: 0, oil_adm_diesel: 0, oil_adm_benzene: 0, oil_total: 0,
                carbon_scope1: 0, carbon_scope2: 0, carbon_total: 0
            });
        };

                </div>

        }

        const SmartWarningLabel = ({ actual, standard, prev, unitText }) => {
            if (actual === '' || actual === null) return null;
            const val = Number(actual);
            const ref = Number(standard) || Number(prev) || 0;
            if (ref === 0 || val === 0) return null;
            
            if (val > ref * 1.5) {
                return (
                    <p className="text-[11px] text-orange-600 font-bold mt-1.5 flex items-center bg-orange-50 px-2 py-1 rounded-md border border-orange-200 animate-in fade-in slide-in-from-top-1">
                        <AlertTriangle className="w-3.5 h-3.5 mr-1" /> สูงกว่าค่าอ้างอิงผิดปกติ (อ้างอิง: {ref.toLocaleString()} {unitText}) ตรวจสอบแล้วใช่หรือไม่?
                    </p>

                    <p className="text-[11px] text-orange-600 font-bold mt-1.5 flex items-center bg-orange-50 px-2 py-1 rounded-md border border-orange-200 animate-in fade-in slide-in-from-top-1">
                        <AlertTriangle className="w-3.5 h-3.5 mr-1" /> ต่ำกว่าค่าอ้างอิงผิดปกติ (อ้างอิง: {ref.toLocaleString()} {unitText}) ตรวจสอบแล้วใช่หรือไม่?
                    </p>

        };

            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const [isAuthenticating, setIsAuthenticating] = useState(false);

            useEffect(() => {
                if (hierarchy.leaves.length > 0 && !hierarchy.leaves.includes(unit)) {
                    setUnit(hierarchy.leaves[0]);

            const handleSubmit = async (e) => {

        function DataEntryForm({ data, onSave, currentUser, globalMonth, selectedYear, hierarchy, onAddLog, showModal }) {

                    },

                        staff: Number(formData.staff_count)||0,
                        area: Number(formData.indoor_area)||0,
                        hours: Number(formData.operating_hours)||0,

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-[#1e293b] px-6 py-5 flex justify-between items-center text-white">
                        <h3 className="font-bold text-lg flex items-center"><FileEdit className="w-5 h-5 mr-2 text-emerald-400"/> แบบฟอร์มบันทึกข้อมูลการใช้พลังงาน</h3>

                    <form onSubmit={handleSubmit} className="p-6 space-y-8">

                                            </optgroup>
                                        ))}
                                    </select>

                                    </select>
                                    <div className="w-1/2 border border-slate-200 rounded-lg p-2.5 bg-slate-100 text-slate-600 font-medium text-sm text-center">ปีงบฯ {selectedYear}</div>

                                <div>

                                    <input type="number" min="0" step="any" name="staff_count" value={formData.staff_count} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-slate-400 bg-white" />

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-6">
                                <div className="border border-blue-100 rounded-xl p-5 bg-gradient-to-b from-blue-50/50 to-white shadow-sm">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-100 pb-3">
                                        <h4 className="font-bold text-blue-700 flex items-center text-lg"><Zap className="w-5 h-5 mr-2 text-blue-500"/> ไฟฟ้า</h4>

                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-medium text-slate-500 block mb-1">ค่าอ้างอิง (Baseline / หน่วย)</label>
                                            <input type="number" min="0" step="any" name="elec_std" value={formData.elec_std} onChange={handleChange} required className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 bg-slate-50" readOnly={currentUser.role === 'user'} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 block mb-1">ใช้จริง (Actual / หน่วย)</label>
                                            <input type="number" min="0" step="any" name="elec_act" value={formData.elec_act} onChange={handleChange} required className="w-full border-2 border-blue-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-bold text-blue-700 bg-white" />
                                            <SmartWarningLabel actual={formData.elec_act} standard={formData.elec_std} prev={prevHistoryData.electricity?.actual} unitText="หน่วย" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-500 block mb-1">คิดเป็นเงิน (บาท)</label>
                                            <input type="number" min="0" step="any" name="elec_cost" value={formData.elec_cost} onChange={handleChange} required className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 bg-white" />
                                        </div>
                                    </div>
                                </div>
                                <div className="border border-cyan-100 rounded-xl p-5 bg-gradient-to-b from-cyan-50/50 to-white shadow-sm">
                                    <div className="flex justify-between items-center mb-4 border-b border-cyan-100 pb-3">
                                        <h4 className="font-bold text-cyan-700 flex items-center text-lg"><Droplets className="w-5 h-5 mr-2 text-cyan-500"/> น้ำประปา</h4>
                                    </div>
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-medium text-slate-500 block mb-1">ค่าอ้างอิง (Baseline / ลบ.ม.)</label>
                                            <input type="number" min="0" step="any" name="water_std" value={formData.water_std} onChange={handleChange} required className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-cyan-500 bg-slate-50" readOnly={currentUser.role === 'user'} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 block mb-1">ใช้จริง (Actual / ลบ.ม.)</label>
                                            <input type="number" min="0" step="any" name="water_act" value={formData.water_act} onChange={handleChange} required className="w-full border-2 border-cyan-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 font-bold text-cyan-700 bg-white" />
                                            <SmartWarningLabel actual={formData.water_act} standard={formData.water_std} prev={prevHistoryData.water?.actual} unitText="ลบ.ม." />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-500 block mb-1">คิดเป็นเงิน (บาท)</label>
                                            <input type="number" min="0" step="any" name="water_cost" value={formData.water_cost} onChange={handleChange} required className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-cyan-500 bg-white" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="border border-orange-100 rounded-xl p-5 bg-gradient-to-b from-orange-50/50 to-white shadow-sm h-fit">
                                <div className="flex justify-between items-center mb-5 border-b border-orange-100 pb-3">
                                    <h4 className="font-bold text-orange-700 flex items-center text-lg"><Fuel className="w-5 h-5 mr-2 text-orange-500"/> น้ำมันเชื้อเพลิง (ลิตร)</h4>
                                </div>
                                <div className="bg-white p-4 rounded-lg border border-orange-100 mb-5 shadow-sm">
                                    <h5 className="font-bold text-slate-700 text-sm mb-3 flex items-center"><span className="w-5 h-5 rounded bg-orange-100 text-orange-700 flex items-center justify-center mr-2 text-xs">1</span> ภารกิจปฏิบัติการ</h5>
                                    <div className="space-y-3">
                                        <div className="flex flex-col">
                                            <div className="flex items-center"><label className="text-xs font-medium text-slate-600 w-24">ดีเซล (Diesel)</label><input type="number" min="0" step="any" name="oil_op_diesel" value={formData.oil_op_diesel} onChange={handleChange} className="flex-1 border border-slate-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-orange-500" /></div>
                                        </div>
                                        <div className="flex flex-col">
                                            <div className="flex items-center"><label className="text-xs font-medium text-slate-600 w-24">เบนซิน (Benzene)</label><input type="number" min="0" step="any" name="oil_op_benzene" value={formData.oil_op_benzene} onChange={handleChange} className="flex-1 border border-slate-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-orange-500" /></div>
                                        </div>
                                        <div className="flex flex-col">
                                            <div className="flex items-center"><label className="text-xs font-medium text-slate-600 w-24">อากาศยาน (Jet)</label><input type="number" min="0" step="any" name="oil_op_aviation" value={formData.oil_op_aviation} onChange={handleChange} className="flex-1 border border-slate-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-orange-500" /></div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="bg-white p-4 rounded-lg border border-orange-100 shadow-sm">
                                    <h5 className="font-bold text-slate-700 text-sm mb-3 flex items-center"><span className="w-5 h-5 rounded bg-amber-100 text-amber-700 flex items-center justify-center mr-2 text-xs">2</span> ภารกิจธุรการ</h5>
                                    <div className="space-y-3">
                                        <div className="flex flex-col">
                                            <div className="flex items-center"><label className="text-xs font-medium text-slate-600 w-24">ดีเซล (Diesel)</label><input type="number" min="0" step="any" name="oil_adm_diesel" value={formData.oil_adm_diesel} onChange={handleChange} className="flex-1 border border-slate-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-orange-500" /></div>
                                        </div>
                                        <div className="flex flex-col">
                                            <div className="flex items-center"><label className="text-xs font-medium text-slate-600 w-24">เบนซิน (Benzene)</label><input type="number" min="0" step="any" name="oil_adm_benzene" value={formData.oil_adm_benzene} onChange={handleChange} className="flex-1 border border-slate-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-orange-500" /></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 shadow-sm mt-6 mb-6">
                            <h4 className="font-bold text-slate-700 flex items-center text-sm mb-3">
                                <FileText className="w-4 h-4 mr-2 text-slate-500"/> หมายเหตุ / คำชี้แจง
                            </h4>
                            <textarea name="remarks" value={formData.remarks} onChange={handleChange} rows="3" placeholder="ระบุเหตุผลคำชี้แจง หากมีการใช้พลังงานสูงเกินเกณฑ์ปกติในเดือนนี้..." className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-emerald-500 bg-white resize-none"></textarea>
                        </div>

                        <div className="flex justify-end pt-5 border-t border-slate-200 items-center bg-slate-50/50 -mx-6 -mb-6 px-6 py-4 rounded-b-2xl">
                            {showSuccess && <span className="text-emerald-600 font-bold mr-5 flex items-center text-sm animate-in fade-in slide-in-from-right-4"><CheckCircle2 className="w-5 h-5 mr-1.5"/> บันทึกเข้าฐานข้อมูลเรียบร้อย</span>}
                            <button type="submit" disabled={isSubmitting} className={`text-white px-8 py-2.5 rounded-lg font-bold flex items-center shadow-md transition-all ${isSubmitting ? 'bg-emerald-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 hover:shadow-lg'}`}>
                                {isSubmitting ? <SmallLoader className="w-5 h-5 mr-2 text-white" /> : <Save className="w-5 h-5 mr-2" />} 
                                {isSubmitting ? 'กำลังบันทึก...' : 'บันทึกและส่งรายงาน'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function UnitSettings({ hierarchy, onUpdateHierarchy, onAddLog, showModal }) {
            const [newParentName, setNewParentName] = useState('');
            const [newChildNames, setNewChildNames] = useState({});

            const handleAddParent = () => {
                if (newParentName.trim() === '') return;
                if (hierarchy.parents.includes(newParentName)) return showModal({title: 'เกิดข้อผิดพลาด', message: 'ชื่อกลุ่มหน่วยงานนี้มีอยู่แล้วในระบบ', type: 'error'});
                const updatedDict = { ...hierarchy.dict, [newParentName]: [newParentName] };
                onUpdateHierarchy(updatedDict); onAddLog('เพิ่มกลุ่มหน่วยงาน', `เพิ่มกลุ่มหน่วยแม่: ${newParentName}`); setNewParentName('');
            };

            const handleAddChild = (parent) => {
                const childName = newChildNames[parent];
                if (!childName || childName.trim() === '') return;
                if (hierarchy.leaves.includes(childName)) return showModal({title: 'เกิดข้อผิดพลาด', message: 'ชื่อหน่วยงานย่อยนี้มีอยู่แล้วในระบบ ไม่สามารถซ้ำได้', type: 'error'});
                const updatedChildren = [...hierarchy.dict[parent], childName];
                onUpdateHierarchy({ ...hierarchy.dict, [parent]: updatedChildren }); onAddLog('เพิ่มหน่วยงานย่อย', `เพิ่ม ${childName} ภายใต้กลุ่ม ${parent}`); setNewChildNames(prev => ({ ...prev, [parent]: '' }));
            };

            const handleDeleteChild = (parent, child) => {
                showModal({
                    title: 'ยืนยันการลบ', message: `คุณแน่ใจหรือไม่ว่าต้องการลบหน่วยงาน "${child}" ออกจากระบบ?`, type: 'confirm',
                    onConfirm: () => {
                        const updatedChildren = hierarchy.dict[parent].filter(c => c !== child);
                        onUpdateHierarchy({ ...hierarchy.dict, [parent]: updatedChildren }); onAddLog('ลบหน่วยงานย่อย', `ลบ ${child} ออกจากกลุ่ม ${parent}`);
                    }
                });
            };

            const handleDeleteParent = (parent) => {
                showModal({
                    title: 'คำเตือน: ยืนยันการลบกลุ่ม', message: `คุณต้องการลบกลุ่ม "${parent}" พร้อมทั้งหน่วยงานย่อยทั้งหมดในกลุ่มนี้ใช่หรือไม่?`, type: 'confirm',
                    onConfirm: () => {
                        const newDict = { ...hierarchy.dict }; delete newDict[parent];
                        onUpdateHierarchy(newDict); onAddLog('ลบกลุ่มหน่วยงาน', `ลบกลุ่ม ${parent} ทั้งหมด`);
                    }
                });
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex items-center mb-6 border-b border-slate-100 pb-4">
                            <Network className="w-6 h-6 text-emerald-600 mr-3" />
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 leading-tight">โครงสร้างหน่วยงานในระบบ</h3>
                                <p className="text-xs text-slate-500 mt-1">เพิ่มหรือลดรายชื่อหน่วยงาน เพื่อควบคุมสิทธิ์การเข้าระบบและผังการวิเคราะห์ผล</p>
                            </div>
                        </div>
                        
                        <div className="flex space-x-3 mb-8 bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                            <input type="text" placeholder="พิมพ์ชื่อกลุ่มหน่วยงานหลัก (เช่น สส.ทหาร)" className="border border-slate-300 rounded-lg p-2.5 text-sm flex-1 focus:ring-2 focus:ring-emerald-500 outline-none" value={newParentName} onChange={e => setNewParentName(e.target.value)} />
                            <button onClick={handleAddParent} className="bg-[#1e293b] text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-black transition-colors shadow-sm whitespace-nowrap">+ เพิ่มกลุ่มหน่วยแม่</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {hierarchy.parents.map(parent => (
                                <div key={parent} className="border border-slate-200 rounded-xl shadow-sm bg-white overflow-hidden flex flex-col transition-all hover:shadow-md">
                                    <div className="bg-slate-100 p-3.5 flex justify-between items-center border-b border-slate-200">
                                        <h4 className="font-bold text-sm truncate flex-1 text-slate-800">{parent}</h4>
                                        <button onClick={() => handleDeleteParent(parent)} title="ลบกลุ่มนี้" className="text-slate-400 hover:text-rose-500 hover:bg-white p-1 rounded transition-colors ml-2"><Trash2 className="w-4 h-4" /></button>
                                    </div>
                                    <div className="p-3 flex-1 overflow-y-auto max-h-60 bg-slate-50/50 custom-scrollbar">
                                        <ul className="space-y-1.5">
                                            {hierarchy.dict[parent].map((child, idx) => (
                                                <li key={child} className="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-slate-100 shadow-sm text-[13px] group">
                                                    <span className={`truncate ${idx===0 ? 'font-bold text-emerald-700' : 'text-slate-600 font-medium'}`}>{idx===0 ? `▪ ${child}` : `- ${child}`}</span>
                                                    <button onClick={() => handleDeleteChild(parent, child)} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity"><XCircle className="w-4 h-4" /></button>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="p-3 bg-white border-t border-slate-100">
                                        <div className="flex space-x-2">
                                            <input type="text" placeholder="พิมพ์ชื่อหน่วยย่อย..." className="border border-slate-300 rounded-lg px-3 py-1.5 flex-1 text-[13px] focus:ring-2 focus:ring-emerald-500 outline-none" value={newChildNames[parent] || ''} onChange={e => setNewChildNames(prev => ({...prev, [parent]: e.target.value}))} onKeyDown={e => e.key === 'Enter' && handleAddChild(parent)} />
                                            <button onClick={() => handleAddChild(parent)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white px-3 py-1.5 rounded-lg text-[13px] font-bold transition-colors">เพิ่ม</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function StandardSettings({ data, year, onUpdateStandards, hierarchy, onAddLog, showModal }) {
            const [localStds, setLocalStds] = useState({});

            useEffect(() => {
                const stds = {};
                hierarchy.leaves.forEach(u => {
                    const existing = data.find(d => d.year === year && d.unit === u && d.status === 'submitted');
                    stds[u] = { elec: existing?.electricity?.standard || 50000, water: existing?.water?.standard || 10000 };
                });
                setLocalStds(stds);
            }, [year, data, hierarchy.leaves]);

            const handleChange = (unit, field, value) => setLocalStds(prev => ({ ...prev, [unit]: { ...prev[unit], [field]: value } }));

            const handleSave = async () => {
                await onUpdateStandards(year, localStds);
                onAddLog('ตั้งค่าส่วนกลาง', `อัปเดตค่ากลาง (Baseline) ประจำปีงบฯ ${year}`);
            };

            return (
                <div className="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-[#1e293b] px-6 py-5 flex justify-between items-center text-white">
                        <div>
                            <h3 className="font-bold text-lg flex items-center"><Settings className="w-5 h-5 mr-2 text-cyan-400"/> กำหนดค่าอ้างอิงพลังงาน (Baseline EnB)</h3>
                            <p className="text-[11px] text-slate-400 mt-1 font-medium ml-7">สำหรับใช้ประเมินเป้าหมายการลดใช้พลังงาน 20% ประจำปีงบฯ {year}</p>
                        </div>
                        <button onClick={handleSave} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl flex items-center text-sm font-bold transition-colors shadow-sm"><Save className="w-4 h-4 mr-2"/> บันทึกการตั้งค่า</button>
                    </div>
                    <div className="p-0">
                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-sm text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                                        <th className="p-4 font-bold w-1/3">รายชื่อหน่วยงาน (บก.ทท.)</th>
                                        <th className="p-4 text-center font-bold w-1/3 border-l border-slate-200 text-emerald-700">ค่ากลาง ไฟฟ้า (kWh/เดือน)</th>
                                        <th className="p-4 text-center font-bold w-1/3 border-l border-slate-200 text-cyan-700">ค่ากลาง น้ำประปา (ลบ.ม./เดือน)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {hierarchy.parents.map(parent => (
                                        <Fragment key={`std-${parent}`}>
                                            <tr className="bg-slate-50"><td colSpan={3} className="px-4 py-2.5 font-bold text-slate-800 border-y border-slate-200">{parent}</td></tr>
                                            {hierarchy.dict[parent].map(child => (
                                                <tr key={`std-${child}`} className="hover:bg-emerald-50/30 transition-colors">
                                                    <td className="p-3.5 pl-10 text-slate-600 font-medium">- {child}</td>
                                                    <td className="p-3 text-center border-l border-slate-100"><input type="number" min="0" step="any" value={localStds[child]?.elec || ''} onChange={(e) => handleChange(child, 'elec', e.target.value)} className="border border-slate-300 rounded-lg p-2 w-36 text-right focus:ring-2 focus:ring-emerald-500 outline-none font-mono" /></td>
                                                    <td className="p-3 text-center border-l border-slate-100"><input type="number" min="0" step="any" value={localStds[child]?.water || ''} onChange={(e) => handleChange(child, 'water', e.target.value)} className="border border-slate-300 rounded-lg p-2 w-36 text-right focus:ring-2 focus:ring-cyan-500 outline-none font-mono" /></td>
                                                </tr>
                                            ))}
                                        </Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function StatusTracking({ data, month, year, hierarchy }) {
            const currentData = data.filter(d => d.year === year && d.month === month);
            const totalUnits = hierarchy.leaves.length;
            const submittedCount = currentData.filter(d => d.status === 'submitted').length;
            const progress = totalUnits > 0 ? (submittedCount / totalUnits) * 100 : 0;

            return (
                <div className="max-w-5xl mx-auto space-y-6 animate-in fade-in duration-500">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex justify-between items-end mb-4">
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">สถานะการส่งรายงาน ประจำเดือน {month} {year}</h3>
                                <p className="text-sm text-slate-500 mt-1">ติดตามความคืบหน้าการบันทึกข้อมูลของแต่ละหน่วยงาน</p>
                            </div>
                            <div className="text-right">
                                <span className="text-3xl font-bold text-emerald-600">{submittedCount}</span>
                                <span className="text-slate-400 font-medium mx-1">/</span>
                                <span className="text-xl font-bold text-slate-700">{totalUnits}</span>
                                <p className="text-xs text-slate-500 font-medium uppercase mt-1">หน่วยงานที่ส่งแล้ว</p>
                            </div>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3 relative overflow-hidden border border-slate-200">
                            <div className="h-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                                    <th className="p-4 font-bold w-1/2">หน่วยงาน</th>
                                    <th className="p-4 font-bold text-center">สถานะ</th>
                                    <th className="p-4 font-bold text-right">การจัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {hierarchy.parents.map(parent => (
                                    <Fragment key={parent}>
                                        <tr className="bg-slate-50/80"><td colSpan={3} className="px-4 py-3 font-bold text-slate-800 border-y border-slate-200">{parent}</td></tr>
                                        {hierarchy.dict[parent].map(child => {
                                            const item = currentData.find(d => d.unit === child);
                                            const isSubmitted = item && item.status === 'submitted';
                                            return (
                                                <tr key={child} className="hover:bg-emerald-50/30 transition-colors">
                                                    <td className="p-4 pl-10 text-slate-700 font-medium">- {child}</td>
                                                    <td className="p-4 text-center">
                                                        {isSubmitted ? (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"><CheckCircle2 className="w-3.5 h-3.5 mr-1" /> ส่งมอบแล้ว</span>
                                                        ) : (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200"><Clock className="w-3.5 h-3.5 mr-1" /> รอดำเนินการ</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        {!isSubmitted && <button className="text-xs text-emerald-600 hover:text-emerald-800 font-bold px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition-colors">แจ้งเตือน</button>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AuditLogs({ logs }) {
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 20;
            const totalPages = Math.ceil(logs.length / itemsPerPage);
            
            const paginatedLogs = useMemo(() => {
                const startIndex = (currentPage - 1) * itemsPerPage;
                return logs.slice(startIndex, startIndex + itemsPerPage);
            }, [logs, currentPage]);

            return (
                <div className="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-[#1e293b] px-6 py-5 flex justify-between items-center text-white">
                        <h3 className="font-bold text-lg flex items-center"><HistoryIcon className="w-5 h-5 mr-2 text-emerald-400"/> ประวัติการใช้งานระบบ (System Audit Logs)</h3>
                        <span className="text-xs text-slate-400 font-medium bg-slate-800 px-3 py-1 rounded-full">พบข้อมูลทั้งหมด {logs.length} รายการ</span>
                    </div>
                    <div className="p-0">
                        {logs.length === 0 ? (
                            <div className="p-16 text-center text-slate-400 flex flex-col items-center">
                                <HistoryIcon className="w-12 h-12 mb-3 opacity-20" />
                                <p className="font-medium">ยังไม่มีข้อมูลประวัติการใช้งานในฐานข้อมูล</p>
                            </div>
                        ) : (
                            <>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-[13px] text-left">
                                        <thead className="bg-slate-100 shadow-sm border-b border-slate-200">
                                            <tr className="text-slate-600">
                                                <th className="p-4 font-bold w-1/5">วัน-เวลา (Timestamp)</th>
                                                <th className="p-4 font-bold w-1/4">ผู้ใช้งาน (User / Unit)</th>
                                                <th className="p-4 font-bold w-1/5">ประเภทการกระทำ</th>
                                                <th className="p-4 font-bold">รายละเอียดเพิ่มเติม</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {paginatedLogs.map((log, i) => (
                                                <tr key={log.id || i} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 text-slate-500 font-mono text-xs">{log.timestamp}</td>
                                                    <td className="p-4">
                                                        <span className="font-bold text-slate-700 block">{log.user}</span>
                                                        <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">{log.role}</span>
                                                    </td>
                                                    <td className="p-4"><span className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-full text-[11px] font-bold">{log.action}</span></td>
                                                    <td className="p-4 text-slate-600 font-medium">{log.details}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                {totalPages > 1 && (
                                    <div className="flex items-center justify-between px-6 py-4 border-t border-slate-200 bg-slate-50">
                                        <p className="text-xs text-slate-500 font-medium">แสดงหน้าที่ {currentPage} จากทั้งหมด {totalPages} หน้า</p>
                                        <div className="flex space-x-2">
                                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className={`px-3 py-1.5 rounded-lg text-sm font-bold flex items-center transition-colors ${currentPage === 1 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100'}`}>
                                                <ChevronLeft className="w-4 h-4 mr-1"/> ก่อนหน้า
                                            </button>
                                            <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className={`px-3 py-1.5 rounded-lg text-sm font-bold flex items-center transition-colors ${currentPage === totalPages ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100'}`}>
                                                ถัดไป <ChevronRight className="w-4 h-4 ml-1"/>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function ReportExport({ data, month, year, hierarchy, currentUser }) {
            const isYearly = month === 'สรุปรายปี';
            const targetUnits = currentUser.role === 'user' ? [currentUser.unit] : hierarchy.leaves;

            const monthlyData = useMemo(() => {
                return MONTHS.map(m => {
                    const mData = data.filter(d => d.year === year && d.month === m && targetUnits.includes(d.unit) && d.status === 'submitted');
                    const totals = aggregateTotals(mData);
                    return { month: m, ...totals };
                });
            }, [data, year, targetUnits]);

            const monthlyTotals = useMemo(() => {
                return monthlyData.reduce((acc, curr) => {
                    acc.elec_std += curr.elec_std; acc.elec_act += curr.elec_act; acc.elec_cost += curr.elec_cost;
                    acc.water_std += curr.water_std; acc.water_act += curr.water_act; acc.water_cost += curr.water_cost;
                    acc.oil_total += curr.oil_total;
                    return acc;
                }, { elec_std: 0, elec_act: 0, elec_cost: 0, water_std: 0, water_act: 0, water_cost: 0, oil_total: 0 });
            }, [monthlyData]);

            const exportData = useMemo(() => {
                return targetUnits.map(unit => {
                    const unitData = data.filter(d => d.year === year && (isYearly ? true : d.month === month) && d.unit === unit && d.status === 'submitted');
                    const totals = aggregateTotals(unitData);

                    const parent = hierarchy.parents.find(p => hierarchy.dict[p].includes(unit)) || '';
                    
                    // หาหมายเหตุของเดือนล่าสุด
                    const latestRecord = unitData.length > 0 ? unitData[unitData.length - 1] : null;
                    const remarks = latestRecord?.extra_info?.remarks || '-';

                    return {
                        unit, parent,
                        elec_std: totals.elec_std, elec_act: totals.elec_act, elec_cost: totals.elec_cost,
                        water_std: totals.water_std, water_act: totals.water_act, water_cost: totals.water_cost,
                        oil_op_diesel: totals.oil_op_diesel, oil_op_benzene: totals.oil_op_benzene, oil_op_aviation: totals.oil_op_aviation,
                        oil_adm_diesel: totals.oil_adm_diesel, oil_adm_benzene: totals.oil_adm_benzene,
                        oil_total: totals.oil_total,
                        remarks
                    };
                });
            }, [data, month, year, hierarchy, currentUser, isYearly, targetUnits]);

            const handleExportCSV = () => {
                const headers = ['สังกัด', 'หน่วยงาน', 'ไฟฟ้า ค่ากลาง (หน่วย)', 'ไฟฟ้า ใช้จริง (หน่วย)', 'ไฟฟ้า ผลต่าง', 'ไฟฟ้า ค่าใช้จ่าย (บาท)', 'น้ำประปา ค่ากลาง (ลบ.ม.)', 'น้ำประปา ใช้จริง (ลบ.ม.)', 'น้ำประปา ผลต่าง', 'น้ำประปา ค่าใช้จ่าย (บาท)', 'น้ำมัน ปฏิบัติการ ดีเซล', 'น้ำมัน ปฏิบัติการ เบนซิน', 'น้ำมัน ปฏิบัติการ อากาศยาน', 'น้ำมัน ธุรการ ดีเซล', 'น้ำมัน ธุรการ เบนซิน', 'น้ำมันรวม (ลิตร)', 'หมายเหตุชี้แจง'];
                const rows = exportData.map((row) => [
                    row.parent, row.unit,
                    row.elec_std, row.elec_act, row.elec_act - row.elec_std, row.elec_cost,
                    row.water_std, row.water_act, row.water_act - row.water_std, row.water_cost,
                    row.oil_op_diesel, row.oil_op_benzene, row.oil_op_aviation,
                    row.oil_adm_diesel, row.oil_adm_benzene, row.oil_total,
                    `"${row.remarks.replace(/"/g, '""')}"`
                ]);

                const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `รายงานพลังงาน_บก.ทท._${isYearly ? 'รายปี' : month}_${year}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const num = (val) => val === 0 ? '0' : (val || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
            const numDec = (val) => val === 0 ? '0' : (val || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            const renderDiff = (actual, std) => {
                if (actual === 0 && std === 0) return <span className="text-emerald-500">0</span>;
                const diff = actual - std;
                if (diff > 0) return <span className="text-rose-500 font-medium">+{diff.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>;
                if (diff < 0) return <span className="text-emerald-500 font-medium">{diff.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>;
                return <span className="text-emerald-500 font-medium">0</span>;
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-slate-200 print:shadow-none print:border-none print:p-0 animate-in fade-in duration-500">

                    <div className="flex justify-end space-x-3 no-print">
                        <button onClick={() => window.print()} className="flex items-center bg-[#1e293b] text-white px-4 py-2.5 rounded-lg hover:bg-black transition-colors shadow-sm font-bold text-sm">
                            <Printer className="w-4 h-4 mr-2" /> พิมพ์รายงาน (PDF)
                        </button>
                        <button onClick={handleExportCSV} className="flex items-center bg-[#10b981] text-white px-4 py-2.5 rounded-lg hover:bg-emerald-600 transition-colors shadow-sm font-bold text-sm">
                            <Download className="w-4 h-4 mr-2" /> ดาวน์โหลด Excel (CSV)
                        </button>
                    </div>

                    <div className="text-center mb-10 mt-4">
                        <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-100 shadow-sm">
                            <FileText className="w-8 h-8" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 print:text-black mb-2">รายงานสรุปการใช้พลังงาน กองบัญชาการกองทัพไทย (บก.ทท.)</h2>
                        <p className="text-lg text-slate-600 print:text-black">ประจำ{isYearly ? 'ปีงบประมาณ' : `เดือน ${month} ปีงบประมาณ`} {year}</p>
                    </div>

                    {(currentUser.role === 'admin' || currentUser.role === 'executive') && (
                        <div className="overflow-x-auto border border-slate-300 rounded-sm mb-12">
                            <table className="w-full text-sm text-center border-collapse">
                                <thead>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-3 border border-slate-600 font-bold align-middle w-24" rowSpan="2">เดือน</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="4">ไฟฟ้า</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="4">น้ำประปา</th>
                                        <th className="p-2 border border-slate-600 font-bold">น้ำมัน</th>
                                    </tr>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-24">ค่ากลาง<br/>(หน่วย)</th>
                                        <th className="p-2 border border-slate-600 font-bold text-xs w-24">ใช้จริง<br/>(หน่วย)</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-24">ผลต่าง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-28">จำนวนเงิน(฿)</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-24">ค่ากลาง<br/>(ลบ.ม.)</th>
                                        <th className="p-2 border border-slate-600 font-bold text-xs w-24">ใช้จริง<br/>(ลบ.ม.)</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-24">ผลต่าง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-28">จำนวนเงิน(฿)</th>
                                        <th className="p-2 border border-slate-600 font-bold text-xs w-24">ใช้จริง<br/>(ลิตร)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {monthlyData.map((row, idx) => (
                                        <tr key={row.month} className="hover:bg-slate-50 border-b border-slate-200 last:border-b-0">
                                            <td className="p-2 border-r border-slate-200 font-bold text-slate-800">{row.month}</td>
                                            <td className="p-2 border-r border-slate-200 text-right">{num(row.elec_std)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right font-bold text-blue-600">{num(row.elec_act)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right">{renderDiff(row.elec_act, row.elec_std)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right">{numDec(row.elec_cost)}</td>

                                            <td className="p-2 border-r border-slate-200 text-right">{num(row.water_std)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right font-bold text-teal-600">{num(row.water_act)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right">{renderDiff(row.water_act, row.water_std)}</td>
                                            <td className="p-2 border-r border-slate-200 text-right">{numDec(row.water_cost)}</td>

                                            <td className="p-2 text-right font-bold text-orange-600">{num(row.oil_total)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot>
                                    <tr className="bg-slate-100 border-t-2 border-slate-400 font-bold text-slate-800">
                                        <td className="p-3 border-r border-slate-300">รวมทั้งสิ้น<br/><span className="text-xs font-normal">(YTD)</span></td>
                                        <td className="p-3 border-r border-slate-300 text-right">{num(monthlyTotals.elec_std)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right text-blue-700">{num(monthlyTotals.elec_act)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right">{renderDiff(monthlyTotals.elec_act, monthlyTotals.elec_std)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right">{numDec(monthlyTotals.elec_cost)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right">{num(monthlyTotals.water_std)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right text-teal-700">{num(monthlyTotals.water_act)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right">{renderDiff(monthlyTotals.water_act, monthlyTotals.water_std)}</td>
                                        <td className="p-3 border-r border-slate-300 text-right">{numDec(monthlyTotals.water_cost)}</td>
                                        <td className="p-3 text-right text-orange-700">{num(monthlyTotals.oil_total)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    )}

                    <div className="mb-10 page-break-before">
                        <div className="flex items-center mb-4">
                            <span className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm mr-3">1</span>
                            <h3 className="font-bold text-slate-800 text-lg">สรุปการใช้พลังงานแยกตามหน่วยงาน <span className="text-slate-500 font-medium text-base">({isYearly ? 'ยอดสะสมทั้งปี' : `ประจำเดือน ${month}`})</span></h3>
                        </div>
                        <div className="overflow-x-auto border border-slate-300 rounded-sm">
                            <table className="w-full text-sm text-center border-collapse">
                                <thead>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-3 border border-slate-600 font-bold align-middle w-[25%]" rowSpan="2">หน่วยงาน / สังกัด</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="4">ไฟฟ้า (kWh)</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="4">น้ำประปา (ลบ.ม.)</th>
                                    </tr>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-2 border border-slate-600 font-normal text-xs">ค่ากลาง</th>
                                        <th className="p-2 border border-slate-600 font-bold text-xs">ใช้จริง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs">ผลต่าง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs">จำนวนเงิน(฿)</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs">ค่ากลาง</th>
                                        <th className="p-2 border border-slate-600 font-bold text-xs">ใช้จริง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs">ผลต่าง</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs">จำนวนเงิน(฿)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {exportData.map((row, idx) => {
                                        const isFirstInParent = idx === 0 || exportData[idx - 1].parent !== row.parent;
                                        return (
                                            <tr key={`unit-ew-${row.unit}`} className="hover:bg-slate-50 border-b border-slate-200">
                                                <td className="p-2 border-r border-slate-200 text-left relative flex items-center">
                                                    {isFirstInParent && currentUser.role !== 'user' && (
                                                        <span className="font-bold text-slate-800 w-1/2 truncate pr-2" title={row.parent}>{row.parent}</span>
                                                    )}
                                                    {(!isFirstInParent || currentUser.role === 'user') && currentUser.role !== 'user' && <span className="w-1/2"></span>}
                                                    <span className={`text-slate-600 ${currentUser.role !== 'user' ? 'w-1/2 border-l border-slate-200 pl-3' : 'w-full font-bold text-slate-800'} truncate`} title={row.unit}>
                                                        {currentUser.role !== 'user' && '- '}{row.unit}
                                                    </span>
                                                </td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.elec_std)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right font-bold text-blue-600">{num(row.elec_act)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{renderDiff(row.elec_act, row.elec_std)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{numDec(row.elec_cost)}</td>

                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.water_std)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right font-bold text-teal-600">{num(row.water_act)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{renderDiff(row.water_act, row.water_std)}</td>
                                                <td className="p-2 text-right">{numDec(row.water_cost)}</td>
                                            </tr>
                                        );
                                    })}
                                    {exportData.length === 0 && <tr><td colSpan="9" className="p-8 text-slate-400">ไม่มีข้อมูล</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="mb-10 page-break-before">
                        <div className="flex items-center mb-4">
                            <span className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm mr-3">2</span>
                            <h3 className="font-bold text-slate-800 text-lg">ข้อมูลการใช้น้ำมันเชื้อเพลิง (ลิตร)</h3>
                        </div>
                        <div className="overflow-x-auto border border-slate-300 rounded-sm">
                            <table className="w-full text-sm text-center border-collapse">
                                <thead>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-3 border border-slate-600 font-bold align-middle w-[25%]" rowSpan="2">หน่วยงาน / สังกัด</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="3">ปฏิบัติการ</th>
                                        <th className="p-2 border border-slate-600 font-bold" colSpan="2">ธุรการ</th>
                                        <th className="p-3 border border-slate-600 font-bold align-middle w-24" rowSpan="2">รวม (ลิตร)</th>
                                    </tr>
                                    <tr className="bg-[#1e293b] text-white">
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-[12%]">ดีเซล</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-[12%]">เบนซิน</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-[12%]">อากาศยาน</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-[12%]">ดีเซล</th>
                                        <th className="p-2 border border-slate-600 font-normal text-xs w-[12%]">เบนซิน</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {exportData.map((row, idx) => {
                                        const isFirstInParent = idx === 0 || exportData[idx - 1].parent !== row.parent;
                                        return (
                                            <tr key={`unit-oil-${row.unit}`} className="hover:bg-slate-50 border-b border-slate-200">
                                                <td className="p-2 border-r border-slate-200 text-left relative flex items-center">
                                                    {isFirstInParent && currentUser.role !== 'user' && (
                                                        <span className="font-bold text-slate-800 w-1/2 truncate pr-2" title={row.parent}>{row.parent}</span>
                                                    )}
                                                    {(!isFirstInParent || currentUser.role === 'user') && currentUser.role !== 'user' && <span className="w-1/2"></span>}
                                                    <span className={`text-slate-600 ${currentUser.role !== 'user' ? 'w-1/2 border-l border-slate-200 pl-3' : 'w-full font-bold text-slate-800'} truncate`} title={row.unit}>
                                                        {currentUser.role !== 'user' && '- '}{row.unit}
                                                    </span>
                                                </td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.oil_op_diesel)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.oil_op_benzene)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.oil_op_aviation)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.oil_adm_diesel)}</td>
                                                <td className="p-2 border-r border-slate-200 text-right">{num(row.oil_adm_benzene)}</td>
                                                <td className="p-2 text-right font-bold text-orange-600">{num(row.oil_total)}</td>
                                            </tr>
                                        );
                                    })}
                                    {exportData.length === 0 && <tr><td colSpan="7" className="p-8 text-slate-400">ไม่มีข้อมูล</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="mt-12 pt-8 flex justify-between no-print border-t border-slate-100">
                        <p className="text-xs text-slate-400">สร้างจากระบบฐานข้อมูลอัตโนมัติเมื่อ: {new Date().toLocaleString('th-TH')}</p>
                    </div>
                </div>
            );
        }

        function BackupSettings({ data, logs, hierarchy, showModal, onRestore }) {
            const handleExport = () => {
                const backupData = {
                    data, logs, hierarchy,
                    admins: localStorage.getItem('energy_admins'),
                    execs: localStorage.getItem('energy_execs'),
                    units: localStorage.getItem('energy_units'),
                    announcement: localStorage.getItem('energy_announcement'),
                    timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `energy_backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.data && parsed.hierarchy) {
                            showModal({
                                title: 'ยืนยันการกู้คืนข้อมูล',
                                message: 'การกู้คืนข้อมูลจะทับข้อมูลปัจจุบันทั้งหมด คุณแน่ใจหรือไม่?',
                                type: 'confirm',
                                onConfirm: () => {
                                    onRestore(parsed);
                                    showModal({title: 'สำเร็จ', message: 'กู้คืนข้อมูลเรียบร้อยแล้ว ระบบจะทำการรีเฟรชหน้าเว็บ', type: 'alert', onConfirm: () => window.location.reload()});
                                }
                            });
                        } else {
                            showModal({title: 'ไฟล์ไม่ถูกต้อง', message: 'โครงสร้างไฟล์ JSON ไม่รองรับ กรุณาใช้ไฟล์ที่ได้จากการสำรองข้อมูลในระบบนี้เท่านั้น', type: 'error'});
                        }
                    } catch (err) {
                        showModal({title: 'ข้อผิดพลาด', message: 'ไม่สามารถอ่านไฟล์ JSON ได้', type: 'error'});
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-[#1e293b] px-6 py-5 text-white">
                            <h3 className="font-bold text-lg flex items-center"><Database className="w-5 h-5 mr-2 text-emerald-400"/> สำรองและกู้คืนฐานข้อมูล (Backup & Restore)</h3>
                            <p className="text-xs text-slate-400 mt-1 ml-7">เนื่องจากข้อมูลถูกจัดเก็บไว้ในเบราว์เซอร์ จึงแนะนำให้ทำการสำรองข้อมูลทุกเดือนเพื่อป้องกันข้อมูลสูญหาย</p>
                        </div>
                        <div className="p-8">
                            <div className="flex flex-col md:flex-row gap-8">
                                <div className="flex-1 bg-emerald-50 rounded-xl p-6 border border-emerald-100 flex flex-col justify-center items-center text-center">
                                    <Download className="w-12 h-12 text-emerald-500 mb-4" />
                                    <h4 className="font-bold text-slate-800 mb-2">สำรองข้อมูลทั้งหมด</h4>
                                    <p className="text-xs text-slate-500 mb-6">บันทึกข้อมูลรายงาน การตั้งค่า และรหัสผ่านทั้งหมดลงในคอมพิวเตอร์ของคุณเป็นไฟล์ .json</p>
                                    <button onClick={handleExport} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition-colors">Export ข้อมูล (JSON)</button>
                                </div>
                                <div className="flex-1 bg-amber-50 rounded-xl p-6 border border-amber-100 flex flex-col justify-center items-center text-center">
                                    <Upload className="w-12 h-12 text-amber-500 mb-4" />
                                    <h4 className="font-bold text-slate-800 mb-2">กู้คืนข้อมูลระบบ</h4>
                                    <p className="text-xs text-slate-500 mb-6">อัปโหลดไฟล์ .json เพื่อกู้คืนข้อมูลเดิมกลับมา (จะทับข้อมูลที่มีอยู่ในปัจจุบันทั้งหมด)</p>
                                    <div className="w-full relative">
                                        <input type="file" accept=".json" onChange={handleImport} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                        <div className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition-colors pointer-events-none">Import ข้อมูล (JSON)</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AccessSettings({ adminPasswords, execPasswords, unitPasswords, hierarchy, globalAnnouncement, onUpdateAccess, showModal, currentUser }) {
            const [localAdmins, setLocalAdmins] = useState(adminPasswords || {});
            const [localExecs, setLocalExecs] = useState(execPasswords || {});
            const [localUnits, setLocalUnits] = useState(unitPasswords || {});
            const [localAnnouncement, setLocalAnnouncement] = useState(globalAnnouncement || '');
            const [tempPwds, setTempPwds] = useState({});

            useEffect(() => setLocalAdmins(adminPasswords || {}), [adminPasswords]);
            useEffect(() => setLocalExecs(execPasswords || {}), [execPasswords]);
            useEffect(() => setLocalUnits(unitPasswords || {}), [unitPasswords]);
            useEffect(() => setLocalAnnouncement(globalAnnouncement || ''), [globalAnnouncement]);

            const [newAdmin, setNewAdmin] = useState({username: '', password: ''});
            const [newExec, setNewExec] = useState({username: '', password: ''});

            const handleSaveAdmins = () => onUpdateAccess('adminPasswords', localAdmins, 'ผู้ดูแลระบบ');
            const handleSaveExecs = () => onUpdateAccess('execPasswords', localExecs, 'ผู้บริหาร');
            const handleSaveUnits = () => onUpdateAccess('passwords', localUnits, 'หน่วยงาน');
            const handleSaveAnnouncement = () => onUpdateAccess('announcement', localAnnouncement, 'ประกาศส่วนกลาง');

            const renderUserList = (usersDict, setUsersDict, newObj, setNewObj) => {
                return (
                    <div className="space-y-4">
                        <div className="flex flex-col sm:flex-row items-center sm:space-x-3 space-y-3 sm:space-y-0 mb-4 p-4 bg-slate-100 rounded-xl border border-slate-200">
                            <input type="text" placeholder="ชื่อผู้ใช้งานใหม่ (Username)" value={newObj.username} onChange={e => setNewObj({...newObj, username: e.target.value})} className="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full sm:flex-1 focus:ring-2 focus:ring-emerald-500 outline-none" />
                            <input type="password" placeholder="รหัสผ่าน (Password)" value={newObj.password} onChange={e => setNewObj({...newObj, password: e.target.value})} className="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full sm:flex-1 focus:ring-2 focus:ring-emerald-500 outline-none" />
                            <button type="button" onClick={async () => {
                                if(!newObj.username || !newObj.password) return showModal({title:'ข้อผิดพลาด', message:'กรุณากรอกข้อมูลให้ครบถ้วนทั้งสองช่อง', type:'error'});
                                if(usersDict[newObj.username]) return showModal({title:'ข้อผิดพลาด', message:'มีชื่อผู้ใช้งานนี้อยู่ในระบบแล้ว', type:'error'});
                                const hashedPwd = await hashPassword(newObj.password);
                                setUsersDict({...usersDict, [newObj.username]: hashedPwd});
                                setNewObj({username: '', password: ''});
                            }} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold w-full sm:w-auto hover:bg-black transition-colors whitespace-nowrap">เพิ่มบัญชี</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {Object.keys(usersDict).map(u => (
                                <div key={u} className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <div className="flex items-center">
                                        <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mr-3 font-bold flex-shrink-0"><UserIcon className="w-4 h-4"/></div>
                                        <span className="text-sm font-bold text-slate-800 break-all">{u} {u === currentUser.unit && currentUser.role === 'admin' && <span className="ml-2 text-[10px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded border border-emerald-200 flex-shrink-0">(คุณ)</span>}</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <input type="password" placeholder="•••••••• (ตั้งใหม่)" value={tempPwds[u] || ''} onChange={(e) => setTempPwds({...tempPwds, [u]: e.target.value})} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm w-32 text-center focus:ring-2 focus:ring-emerald-500 bg-slate-50 outline-none" />
                                        <button type="button" onClick={async () => {
                                            if(!tempPwds[u]) return showModal({title:'แจ้งเตือน', message:'กรุณาพิมพ์รหัสผ่านใหม่ที่ต้องการเปลี่ยนลงในช่องก่อน', type:'alert'});
                                            const hashed = await hashPassword(tempPwds[u]);
                                            setUsersDict({...usersDict, [u]: hashed});
                                            const t = {...tempPwds}; delete t[u]; setTempPwds(t);
                                            showModal({title:'พักข้อมูลสำเร็จ', message:'รหัสผ่านถูกจำไว้ชั่วคราวแล้ว (อย่าลืมกดปุ่ม "บันทึกข้อมูล" ด้านบนเพื่อยืนยันอีกครั้ง)', type:'alert'});
                                        }} className="text-emerald-600 hover:text-white p-1.5 px-3 rounded-lg transition-colors bg-emerald-50 hover:bg-emerald-600 text-xs font-bold border border-emerald-200">อัปเดต</button>
                                        <button type="button" onClick={() => {
                                            if (u === currentUser.unit && currentUser.role === 'admin') return showModal({title:'ข้อผิดพลาด', message:'ไม่สามารถลบบัญชีตัวเองขณะที่กำลังใช้งานอยู่ได้', type:'error'});
                                            const copy = {...usersDict}; delete copy[u]; setUsersDict(copy);
                                        }} className="text-slate-400 hover:text-rose-500 p-2 rounded transition-colors bg-white hover:bg-rose-50"><Trash2 className="w-4 h-4" /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6 animate-in fade-in duration-500">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-[#1e293b] px-6 py-4 flex flex-col sm:flex-row justify-between items-center text-white gap-3 sm:gap-0">
                            <h3 className="font-bold text-base flex items-center"><Megaphone className="w-5 h-5 mr-2 text-purple-400"/> ตั้งค่าประกาศส่วนกลาง (Announcement)</h3>
                            <button onClick={handleSaveAnnouncement} className="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-lg flex items-center text-sm font-bold transition-colors w-full sm:w-auto justify-center"><Save className="w-4 h-4 mr-2"/> บันทึกข้อความ</button>
                        </div>
                        <div className="p-6 bg-slate-50/50">
                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ข้อความประกาศให้ทุกหน่วยงานเห็น (หน้า Login และ Dashboard)</label>
                            <input type="text" placeholder="เว้นว่างไว้หากไม่ต้องการให้มีประกาศ..." value={localAnnouncement} onChange={(e) => setLocalAnnouncement(e.target.value)} className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                            <p className="text-[11px] text-slate-400 mt-2">ตัวอย่าง: "กรุณาส่งรายงานพลังงานของเดือน เม.ย. ภายในวันที่ 5 พ.ค."</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-[#1e293b] px-6 py-4 flex flex-col sm:flex-row justify-between items-center text-white gap-3 sm:gap-0">
                            <h3 className="font-bold text-base flex items-center"><ShieldCheck className="w-5 h-5 mr-2 text-emerald-400"/> 1. บัญชีผู้ดูแลระบบ (Admin)</h3>
